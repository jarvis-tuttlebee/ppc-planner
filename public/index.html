<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPC - HOMEBASE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Forma DJR — self-hosted, PPC design system (see public/kanban.html for the same setup). */
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-400.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-500.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-900.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #F7F5F2;
      color: #2C2C2C;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 80px;
      gap: 40px;
    }

    /* LOGO */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 304px;
      max-width: 82vw;
      height: auto;
      display: block;
      image-rendering: auto;
      -ms-interpolation-mode: bicubic;
    }
    .brand .tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6B7A8D;
    }

    /* MENU — tight tracking like Press Play wordmark */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: auto;
      gap: 12px;
    }

    .menu-item {
      display: block;
      width: auto;
      padding: 2px 4px;
      border: none;
      border-radius: 0;
      background: transparent;
      text-decoration: none;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.2;
      color: #2C2C2C;
      box-shadow: none;
      transition: color 0.15s ease;
    }
    /* Slight tracking nudge so shorter labels don’t look much narrower */
    .menu-planner { letter-spacing: 0.03em; }
    .menu-taskboard { letter-spacing: 0.08em; }
    .menu-marketing { letter-spacing: 0.01em; }
    .menu-item:visited { color: #2C2C2C; }
    .menu-planner:hover,
    .menu-planner:active { color: #4E6E6C; }
    .menu-taskboard:hover,
    .menu-taskboard:active { color: #564A5E; }
    .menu-marketing:hover,
    .menu-marketing:active { color: #C29A3B; }
    .menu-item span { color: inherit; }

    @media (max-width: 480px) {
      .brand img { width: 240px; }
      .home { gap: 32px; }
      .menu { gap: 10px; }
      .menu-item { font-size: 12px; padding: 2px; }
      .menu-planner { letter-spacing: 0.02em; }
      .menu-taskboard { letter-spacing: 0.06em; }
      .menu-marketing { letter-spacing: 0.01em; }
    }
  </style>
</head>
<body>
  <div class="home">
    <div class="brand">
      <img src="/assets/pressplay-logo-black.png?v=5" alt="Press Play" width="1346" height="280">
      <div class="tag">PPC - HOMEBASE</div>
    </div>

    <nav class="menu">
      <a class="menu-item menu-planner" href="/planner"><span>Annual Planner</span></a>
      <a class="menu-item menu-taskboard" href="/kanban"><span>Task Board</span></a>
      <a class="menu-item menu-marketing" href="/marketing"><span>Marketing System</span></a>
    </nav>
  </div>
</body>
</html>
