<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Press Play — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Forma DJR — self-hosted, PPC design system (see public/kanban.html for the same setup). */
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-400.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-500.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-900.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #F7F5F2;
      color: #2C2C2C;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 80px;
      gap: 72px;
    }

    /* LOGO */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 304px;
      max-width: 82vw;
      height: auto;
      display: block;
    }
    .brand .tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6B7A8D;
    }

    /* MENU */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .menu-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 224px;
      padding: 12px 19px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      text-decoration: none;
      font-family: 'Forma DJR Banner', 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(44,44,44,0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .menu-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 18px rgba(44,44,44,0.18);
    }
    .menu-item:active { transform: translateY(-1px); }
    .menu-item span { color: currentColor; }

    .menu-planner   { color: #4E6E6C; } /* Teal */
    .menu-taskboard { color: #564A5E; } /* Archive Violet */
    .menu-marketing { color: #C29A3B; } /* Muted Mustard */

    @media (max-width: 480px) {
      .brand img { width: 240px; }
      .menu-item { width: 184px; padding: 10px 13px; font-size: 10px; letter-spacing: 0.13em; }
    }
  </style>
</head>
<body>
  <div class="home">
    <div class="brand">
      <img src="/assets/pressplay-logo-master.png" alt="Press Play">
      <div class="tag">Internal Tools</div>
    </div>

    <nav class="menu">
      <a class="menu-item menu-planner" href="/planner.html"><span>Annual Planner</span></a>
      <a class="menu-item menu-taskboard" href="/kanban.html"><span>Task Board</span></a>
      <a class="menu-item menu-marketing" href="/marketing.html"><span>Marketing System</span></a>
    </nav>
  </div>
</body>
</html>
