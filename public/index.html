<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Press Play — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Forma DJR — self-hosted, PPC design system (see public/kanban.html for the same setup). */
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-400.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-500.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-900.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #F7F5F2;
      color: #2C2C2C;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      gap: 56px;
    }

    /* LOGO */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 260px;
      max-width: 80vw;
      height: auto;
      display: block;
    }
    .brand .tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6B7A8D;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 300px));
      gap: 24px;
      width: 100%;
      max-width: 980px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      padding: 28px 26px;
      border-radius: 18px;
      text-decoration: none;
      color: #F7F5F2;
      box-shadow: 0 1px 2px rgba(44,44,44,0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(44,44,44,0.16);
    }
    .card:active { transform: translateY(-1px); }

    .card-planner  { background: #4E6E6C; } /* Teal */
    .card-taskboard{ background: #564A5E; } /* Archive Violet */
    .card-marketing{ background: #C29A3B; } /* Muted Mustard */

    .card .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .card h2 {
      font-family: 'Forma DJR Display', 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-top: 10px;
    }
    .card .arrow {
      align-self: flex-end;
      font-size: 20px;
      font-weight: 600;
      opacity: 0.85;
    }

    @media (max-width: 760px) {
      .cards {
        grid-template-columns: 1fr;
        max-width: 360px;
      }
      .card { min-height: 140px; }
    }
  </style>
</head>
<body>
  <div class="home">
    <div class="brand">
      <img src="/assets/pressplay-logo.png" alt="Press Play">
      <div class="tag">Internal Tools</div>
    </div>

    <div class="cards">
      <a class="card card-planner" href="/planner.html">
        <div class="eyebrow">Calendar</div>
        <h2>Annual&nbsp;Planner</h2>
        <div class="arrow">→</div>
      </a>

      <a class="card card-taskboard" href="/kanban.html">
        <div class="eyebrow">Execution</div>
        <h2>Task&nbsp;Board</h2>
        <div class="arrow">→</div>
      </a>

      <a class="card card-marketing" href="/marketing.html">
        <div class="eyebrow">Content</div>
        <h2>Marketing&nbsp;System</h2>
        <div class="arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
