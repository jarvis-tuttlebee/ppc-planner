<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketing System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #F7F5F2;
      color: #2C2C2C;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel {
      text-align: center;
      max-width: 460px;
    }
    .chip {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C29A3B;
      border: 1.5px solid #C29A3B;
      border-radius: 20px;
      padding: 5px 14px;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Forma DJR Display', 'Poppins', 'DM Sans', sans-serif;
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      color: #6B7A8D;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a.home-link {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #344364;
      border: 1.5px solid #344364;
      border-radius: 20px;
      padding: 8px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="chip">Building now</div>
    <h1>Marketing System</h1>
    <p>The content pipeline — Ideas → Production → Review → Scheduled — is spec'd in HANDOFF.md and next up to build. This page will replace the Miro Content Filter Board.</p>
    <a class="home-link" href="/">← Back home</a>
  </div>
</body>
</html>
