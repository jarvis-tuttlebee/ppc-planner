<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketing System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-400.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-500.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Banner'; src:url('/fonts/forma-djr-banner-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-700.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:'Forma DJR Display'; src:url('/fonts/forma-djr-display-900.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F7F5F2;
      color: #2C2C2C;
      min-height: 100vh;
    }

    .header {
      background: #F7F5F2;
      color: #6B7A8D;
      padding: 16px 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid #e0ddd8;
    }
    .header-title {
      font-family: 'Forma DJR Display', 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #2C2C2C;
      justify-self: center;
    }
    .header-right { text-align: right; }
    .header-right .sub {
      font-size: 11px;
      opacity: 0.55;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header-right .version {
      font-size: 9px;
      letter-spacing: 0.06em;
      opacity: 0.35;
      margin-top: 3px;
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 32px;
      background: #F7F5F2;
      border-bottom: 1px solid #e0ddd8;
    }
    .nav-link {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #344364;
      background: transparent;
      color: #344364;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .nav-link:hover { background: #344364; color: #fff; }
    .nav-link.active { background: #344364; color: #fff; }

    .board {
      display: block;
      padding: 28px 32px 60px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .board-section { border-bottom: 1px solid #E2DDD5; }
    .board-section:first-child { border-top: 1px solid #E2DDD5; }
    .section-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 15px 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .section-row:hover { background: rgba(52,67,100,0.035); }
    .section-leading {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: start;
    }
    .section-title {
      font-family: 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 15.5px;
      font-weight: 700;
      color: #2C2C2C;
      letter-spacing: -0.005em;
      text-align: center;
      justify-self: center;
    }
    .section-trailing {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: end;
    }
    .section-count {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: #9a958d;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .section-chev { color: #9a958d; font-size: 11px; width: 12px; text-align: center; }
    .board-section.open .section-title { color: #344364; }
    .section-body { padding: 4px 2px 22px; }

    .section-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .btn-add {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #344364;
      background: transparent;
      color: #344364;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-add:hover { background: #344364; color: #fff; }

    .mood-viewport {
      position: relative;
      height: 380px;
      overflow: hidden;
      background: #faf9f7;
      border: 1px solid #e8e5e0;
      border-radius: 10px;
      cursor: grab;
      user-select: none;
    }
    .mood-viewport.panning { cursor: grabbing; }
    .mood-viewport.drop-target {
      outline: 2px dashed #564A5E;
      outline-offset: -4px;
      background: rgba(86,74,94,0.04);
    }
    .mood-viewport-hint {
      position: absolute;
      bottom: 8px;
      right: 10px;
      left: 10px;
      font-size: 9px;
      color: #b5b0a8;
      letter-spacing: 0.03em;
      text-align: right;
      z-index: 5;
      pointer-events: none;
    }
    .mood-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 2200px;
      height: 1500px;
      transform-origin: 0 0;
      background-color: #fff;
      background-image: radial-gradient(circle, #e4e0da 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .idea-card {
      background: #F7F5F2;
      border: 1px solid #E2DDD5;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: absolute;
      width: var(--card-size, 180px);
      box-sizing: border-box;
      transition: box-shadow 0.12s, filter 0.12s;
      cursor: grab;
      z-index: 1;
    }
    .idea-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); filter: brightness(0.99); z-index: 2; }
    .idea-card.dragging { cursor: grabbing; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.14); }
    .idea-card.has-cat { background: #F0EDE8; }
    .idea-card .card-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.2);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 2;
    }
    .idea-card:hover .card-delete { opacity: 1; }

    .image-well {
      height: calc(var(--card-size, 180px) * 0.42);
      background: #fff;
      border: 1.5px dashed #d5d0c8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, outline 0.12s;
      outline: none;
    }
    .image-well:hover { border-color: #564A5E; background: rgba(86,74,94,0.03); }
    .image-well.focused {
      border-color: #564A5E;
      border-style: solid;
      background: rgba(86,74,94,0.05);
      outline: 2px solid rgba(86,74,94,0.25);
      outline-offset: 1px;
    }
    .image-well.has-image {
      border-style: solid;
      padding: 6px;
      align-items: center;
      justify-content: center;
    }
    .image-well.drop-target { border-color: #564A5E; background: rgba(86,74,94,0.08); }
    .image-well img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      margin: 0;
    }
    .image-well .placeholder {
      font-size: 10px;
      color: #b5b0a8;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 8px;
      line-height: 1.5;
    }

    .idea-desc::placeholder { color: #b5b0a8; }

    .card-preview { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    .card-cat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .card-desc-preview {
      font-size: 11px;
      line-height: 1.4;
      color: #2C2C2C;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc-preview.empty { color: #b5b0a8; font-style: italic; }
    .card-details-link {
      display: inline-block;
      margin-top: 2px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #6B7A8D;
    }
    .idea-card:hover .card-details-link { color: #344364; text-decoration: underline; }

    .overlay { display: none; position: fixed; inset: 0; z-index: 100; }
    .overlay.open { display: block; }
    .panel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 400px;
      max-width: 100vw;
      background: #fff;
      border-left: 1px solid #e8e5e0;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      z-index: 200;
      overflow-y: auto;
      box-shadow: -6px 0 28px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .panel.open { transform: translateX(0); }
    .panel-strip { height: 5px; flex-shrink: 0; }
    .panel-body-wrap { padding: 28px 28px 32px; flex: 1; }
    .panel-close {
      position: absolute;
      top: 12px; right: 14px;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
      background: none;
      border: none;
      line-height: 1;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
    }
    .panel-close:hover { background: #f3f1ee; color: #555; }
    .panel-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9a958d;
      margin-bottom: 8px;
    }
    .panel-props { margin-bottom: 20px; }
    .prop-row {
      display: flex;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f0ede8;
      gap: 12px;
    }
    .prop-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #9a958d;
      min-width: 72px;
      flex-shrink: 0;
    }
    .prop-value { flex: 1; min-width: 0; }
    .prop-select {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      color: #2C2C2C;
      border: 1px solid #EAE2D6;
      border-radius: 7px;
      padding: 6px 9px;
      background: #fff;
    }
    .panel-divider { border: none; border-top: 1px solid #ede9e3; margin: 18px 0; }
    .fmt-bar { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .fmt-btn {
      width: 28px; height: 26px;
      border: 1px solid #E2DDD5;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      color: #555;
    }
    .fmt-btn:hover { background: #F7F5F2; border-color: #344364; }
    .fmt-btn.wide { width: auto; padding: 0 8px; font-size: 10.5px; }
    .panel-desc {
      min-height: 120px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      line-height: 1.55;
      color: #2C2C2C;
      outline: none;
      border: 1px solid #EAE2D6;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }
    .panel-desc:focus { border-color: #344364; background: #f8f6f3; }
    .panel-desc:empty::before { content: attr(placeholder); color: #ccc; }
    .panel-desc b, .panel-desc strong { font-weight: 700; }
    .panel-image-wrap {
      display: block;
      margin: 4px 0 18px;
    }
    .panel-image-wrap img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e8e5e0;
      background: #faf9f7;
      display: block;
    }
    .panel-image-wrap img.is-empty { display: none; }
    .panel-image-empty {
      display: none;
      width: 100%;
      min-height: 120px;
      border-radius: 8px;
      border: 1.5px dashed #d5d0c8;
      background: #faf9f7;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #b5b0a8;
      letter-spacing: 0.03em;
      text-align: center;
      padding: 16px;
    }
    .panel-image-wrap.empty .panel-image-empty { display: flex; }
    .panel-image-wrap.empty img { display: none; }
    .panel-save-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f0ede8;
    }
    .btn-cancel, .btn-save {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn-cancel {
      border: 1.5px solid #d5d0c8;
      background: transparent;
      color: #6B7A8D;
    }
    .btn-save {
      border: none;
      background: #344364;
      color: #fff;
    }

    .skeleton-body {
      padding: 24px 16px;
      background: #fff;
      border: 1px solid #e8e5e0;
      border-radius: 10px;
      text-align: center;
      color: #b5b0a8;
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .prep-board { display: flex; flex-direction: column; gap: 8px; }
    .pillar {
      background: #fff;
      border: 1px solid #e8e5e0;
      border-radius: 10px;
      overflow: hidden;
      transition: border-radius 0.12s;
    }
    .pillar.is-empty {
      border-radius: 6px;
      background: #faf9f7;
    }
    .pillar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      background: #faf9f7;
      border-bottom: 1px solid transparent;
    }
    .pillar.is-empty .pillar-header {
      padding: 5px 12px;
      gap: 8px;
      background: transparent;
    }
    .pillar.open .pillar-header { border-bottom-color: #e8e5e0; }
    .pillar.is-empty.open .pillar-header { border-bottom-color: #ebe7e1; }
    .pillar-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .pillar.is-empty .pillar-swatch { width: 7px; height: 7px; }
    .pillar-title {
      font-family: 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #2C2C2C;
      flex: 1;
    }
    .pillar.is-empty .pillar-title {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #6B7A8D;
    }
    .pillar-count { font-size: 11px; color: #9a958d; }
    .pillar.is-empty .pillar-count { font-size: 10px; opacity: 0.75; }
    .pillar-chev { font-size: 11px; color: #9a958d; width: 12px; text-align: center; }
    .pillar.is-empty .pillar-chev { font-size: 10px; color: #c4bfb7; }
    .pillar-body { display: none; padding: 12px; }
    .pillar.open .pillar-body { display: block; }
    .pillar.is-empty .pillar-body { padding: 8px 10px 10px; }
    .prep-lanes {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      align-items: flex-start;
    }
    .prep-lane {
      flex: 0 0 168px;
      min-width: 168px;
      background: #faf9f7;
      border: 1px solid #ebe7e1;
      border-radius: 8px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      transition: flex-basis 0.15s, min-width 0.15s, min-height 0.15s;
    }
    .prep-lane.is-empty {
      flex: 0 0 72px;
      min-width: 72px;
      min-height: 40px;
      border-style: dashed;
      background: #fcfbfa;
    }
    .prep-lane.drag-over { outline: 2px dashed #4E6E6C; outline-offset: -2px; background: rgba(78,110,108,0.06); }
    .prep-lane-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6B7A8D;
      padding: 10px 10px 6px;
    }
    .prep-lane.is-empty .prep-lane-title {
      padding: 8px 6px;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.25;
      word-break: break-word;
    }
    .prep-lane-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 8px 10px;
      flex: 1;
      min-height: 60px;
      max-height: 420px;
      overflow-y: auto;
    }
    .prep-lane.is-empty .prep-lane-cards {
      min-height: 24px;
      max-height: none;
      padding: 0 6px 8px;
    }
    .prep-card {
      background: #F7F5F2;
      border: 1px solid #E2DDD5;
      border-radius: 7px;
      padding: 8px;
      cursor: grab;
      transition: box-shadow 0.12s;
      position: relative;
    }
    .prep-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.07); }
    .prep-card.has-cat { background: #F0EDE8; }
    .prep-card.dragging { opacity: 0.55; }
    .prep-card-thumb {
      width: 100%;
      height: 72px;
      border-radius: 5px;
      background: #fff;
      border: 1px solid #e8e5e0;
      overflow: hidden;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prep-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .prep-card-thumb.empty {
      font-size: 9px;
      color: #c4bfb7;
      letter-spacing: 0.04em;
    }
    .prep-card-desc {
      font-size: 11px;
      line-height: 1.35;
      color: #2C2C2C;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .prep-card-desc.empty { color: #b5b0a8; font-style: italic; }
    .prep-card-meta {
      margin-top: 4px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .panel-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-secondary {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 7px 12px;
      border-radius: 20px;
      border: 1.5px solid #344364;
      background: transparent;
      color: #344364;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #344364; color: #fff; }
    .btn-secondary.active { background: #344364; color: #fff; }
    .prepare-dest {
      display: none;
      flex-direction: column;
      width: 100%;
      gap: 0;
      margin-top: 4px;
      padding: 8px 0 0;
      border-top: 1px solid #ebe7e1;
    }
    .prepare-dest .prop-row { border-bottom: none; padding: 6px 0; }
    .btn-danger {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 7px 12px;
      border-radius: 20px;
      border: 1.5px solid #a35d5d;
      background: transparent;
      color: #a35d5d;
      cursor: pointer;
    }
    .btn-danger:hover { background: #a35d5d; color: #fff; }
    .panel-desc.short { min-height: 72px; }

    .ctx-menu {
      display: none;
      position: fixed;
      background: #fff;
      border: 1px solid #E2DDD5;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 100;
      min-width: 140px;
      padding: 4px 0;
    }
    .ctx-menu.open { display: block; }
    .ctx-item {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(52,67,100,0.06); }

    @media (max-width: 700px) {
      .header, .nav-row { padding-left: 16px; padding-right: 16px; }
      .board { padding: 20px 16px 40px; }
      .mood-viewport { height: 300px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-spacer"></div>

const CANVAS_W = 2200;
const CANVAS_H = 1500;
const IMAGE_MAX_EDGE = 1200;

function migrateIdea(idea) {
  if (!idea.body && idea.description) idea.body = idea.description;
  delete idea.description;
  delete idea.types;
  delete idea.rot;
  if (idea.cat && !catById(idea.cat)) idea.cat = 'organic';
  return idea;
}

function migratePrep(card) {
  if (!card.pillar || !pillarById(card.pillar)) card.pillar = 'organic';
  const formats = formatsForPillar(card.pillar);
  if (!card.format || !formats.some(f => f.id === card.format)) {
    card.format = defaultFormatForPillar(card.pillar);
  }
  if (card.productionPlan == null) card.productionPlan = '';
  if (card.fitNote == null) card.fitNote = '';
  return card;
}

function ideaCardSize(count) {
  return Math.round(Math.max(96, Math.min(200, 228 - count * 11)));
}

function ideasOverlap(ax, ay, asize, bx, by, bsize) {
  const pad = 12;
  return ax < bx + bsize + pad && ax + asize + pad > bx && ay < by + bsize + pad && ay + asize + pad > by;
}

function scatterPosition(cardSize) {
  const placed = DATA.ideas.filter(i => i.x != null && i.y != null);
  for (let n = 0; n < 50; n++) {
    const x = 32 + Math.random() * (CANVAS_W - cardSize - 64);
    const y = 32 + Math.random() * (CANVAS_H - cardSize - 100);
    const clash = placed.some(p => ideasOverlap(x, y, cardSize, p.x, p.y, ideaCardSize(DATA.ideas.length)));
    if (!clash) {
      return { x: Math.round(x), y: Math.round(y) };
    }
  }
  const i = placed.length;
  return {
    x: 60 + (i % 7) * (cardSize * 0.55) + Math.random() * 40,
    y: 60 + Math.floor(i / 7) * (cardSize * 0.65) + Math.random() * 30
  };
}

function placeNearMostRecent(cardSize) {
  const placed = DATA.ideas.filter(i => i.x != null && i.y != null);
  const last = placed.length ? placed[placed.length - 1] : null;
  if (!last) return scatterPosition(cardSize);

  const anchorX = last.x;
  const anchorY = last.y;
  const stepBase = cardSize * 0.22;
  const golden = Math.PI * (3 - Math.sqrt(5)); // golden angle spiral

  for (let i = 0; i < 40; i++) {
    const r = stepBase * Math.sqrt(i + 1);
    const angle = i * golden;
    const x = Math.round(anchorX + r * Math.cos(angle));
    const y = Math.round(anchorY + r * Math.sin(angle));
    const cx = Math.max(0, Math.min(CANVAS_W - cardSize, x));
    const cy = Math.max(0, Math.min(CANVAS_H - cardSize, y));

    const clash = placed.some(p => ideasOverlap(cx, cy, cardSize, p.x, p.y, cardSize));
    if (!clash) return { x: cx, y: cy };
  }

  // Fallback: place slightly to the right of the last card.
  return {
    x: Math.max(0, Math.min(CANVAS_W - cardSize, Math.round(anchorX + cardSize * 0.35))),
    y: Math.max(0, Math.min(CANVAS_H - cardSize, Math.round(anchorY + cardSize * 0.08)))
  };
}

function ensureIdeaPositions() {
  const size = ideaCardSize(DATA.ideas.length);
  let changed = false;
  DATA.ideas.forEach(idea => {
    if (idea.x == null || idea.y == null) {
      const pos = scatterPosition(size);
      idea.x = pos.x;
      idea.y = pos.y;
      changed = true;
    }
    if (idea.rot != null) { delete idea.rot; changed = true; }
  });
  return changed;
}

/** Pack ideas into a compact grid so deleted/shrunk cards don't leave huge gaps. */
function restackIdeas() {
  const n = DATA.ideas.length;
  if (!n) return false;
  const size = ideaCardSize(n);
  const gap = Math.max(10, Math.round(size * 0.1));
  const packWidth = Math.min(CANVAS_W - 80, 1080);
  const cols = Math.max(1, Math.floor(packWidth / (size + gap)));
  DATA.ideas.forEach((idea, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    // Light jitter so it still feels like a mood board, not a spreadsheet.
    const jx = ((i * 17) % 7) - 3;
    const jy = ((i * 13) % 7) - 3;
    idea.x = Math.max(0, Math.min(CANVAS_W - size, 36 + col * (size + gap) + jx));
    idea.y = Math.max(0, Math.min(CANVAS_H - size, 36 + row * (size + gap) + jy));
  });
  return true;
}

function ideasAreSparse() {
  const n = DATA.ideas.length;
  if (n < 3) return false;
  const size = ideaCardSize(n);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  DATA.ideas.forEach(idea => {
    const x = idea.x || 0, y = idea.y || 0;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + size);
    maxY = Math.max(maxY, y + size);
  });
  const spanArea = Math.max(1, (maxX - minX) * (maxY - minY));
  const gap = Math.max(10, Math.round(size * 0.1));
  const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
  const packedArea = cols * (size + gap) * Math.ceil(n / cols) * (size + gap);
  return spanArea > packedArea * 2.6;
}

let lastIdeaCardSize = null;
function restackIdeasIfNeeded(force) {
  const size = ideaCardSize(DATA.ideas.length);
  const shrunk = lastIdeaCardSize != null && size < lastIdeaCardSize - 6;
  lastIdeaCardSize = size;
  if (force || shrunk || ideasAreSparse()) {
    return restackIdeas();
  }
  return false;
}

function applyCanvasTransform() {
  if (!moodCanvasEl) return;
  moodCanvasEl.style.transform = 'translate(' + canvasPanX + 'px,' + canvasPanY + 'px) scale(' + canvasZoom + ')';
}

function clientToCanvas(clientX, clientY) {
  const rect = moodViewportEl.getBoundingClientRect();
  return {
    x: (clientX - rect.left - canvasPanX) / canvasZoom,
    y: (clientY - rect.top - canvasPanY) / canvasZoom
  };
}

let panMoveHandler = null;
let panUpHandler = null;

function cleanupMoodPan() {
  if (panMoveHandler) window.removeEventListener('mousemove', panMoveHandler);
  if (panUpHandler) window.removeEventListener('mouseup', panUpHandler);
  panMoveHandler = panUpHandler = null;
}

function setupMoodCanvas(viewport, canvas) {
  cleanupMoodPan();
  applyCanvasTransform();

  viewport.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const before = clientToCanvas(e.clientX, e.clientY);
    const delta = e.deltaY > 0 ? 0.92 : 1.08;
    canvasZoom = Math.min(2.5, Math.max(0.35, canvasZoom * delta));
    canvasPanX = mx - before.x * canvasZoom;
    canvasPanY = my - before.y * canvasZoom;
    applyCanvasTransform();
  }, { passive: false });

  let panning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
  viewport.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.idea-card')) return;
    panning = true;
    viewport.classList.add('panning');
    panStartX = e.clientX;
    panStartY = e.clientY;
    panOriginX = canvasPanX;
    panOriginY = canvasPanY;
    e.preventDefault();
  });
  panMoveHandler = e => {
    if (!panning) return;
    canvasPanX = panOriginX + (e.clientX - panStartX);
    canvasPanY = panOriginY + (e.clientY - panStartY);
    applyCanvasTransform();
  };
  panUpHandler = () => {
    if (!panning) return;
    panning = false;
    viewport.classList.remove('panning');
  };
  window.addEventListener('mousemove', panMoveHandler);
  window.addEventListener('mouseup', panUpHandler);
}

function stripHtml(html) {
  const t = document.createElement('div');
  t.innerHTML = html || '';
  return (t.textContent || '').trim();
}

  return {
    ideas: SAMPLE_IDEAS.map(i => ({ ...i })),

function newId() {

}

function newPrepId() {
  return 'prep-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function prepCards() {
  if (!DATA.sections) DATA.sections = { preparation: [], execution: [], review: [], schedule: [] };
  if (!Array.isArray(DATA.sections.preparation)) DATA.sections.preparation = [];
  return DATA.sections.preparation;
}

function typeLabel(id) {
  const c = catById(id);
  return c ? c.label : id;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 400);
}

function saveData() {
  const payload = {
    ideas: DATA.ideas.map(i => ({ ...i })),
    sections: {
      preparation: prepCards().map(c => ({ ...c })),
      execution: (DATA.sections.execution || []).slice(),
      review: (DATA.sections.review || []).slice(),
      schedule: (DATA.sections.schedule || []).slice()
    }
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
  fetch(SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(err => console.warn('Marketing sync failed:', err));
}

function normalizeLoaded(data) {
  const sections = data.sections || { preparation: [], execution: [], review: [], schedule: [] };
  let preparation = Array.isArray(sections.preparation) ? sections.preparation.map(migratePrep) : [];
  // Seed sample prep only when cloud/local has ideas but empty preparation (first upgrade).
  if (!preparation.length && Array.isArray(data.ideas) && data.ideas.length) {
    // Don't auto-seed samples over existing user ideas — only when defaulting fresh.
  }
  return {
    ideas: (data.ideas || []).map(migrateIdea),
    sections: {
      preparation,
      execution: sections.execution || [],
      review: sections.review || [],
      schedule: sections.schedule || []
    }
  };
}

async function initApp() {
  let data = null;
  let cloudOk = false;
  let shouldRestoreToCloud = false;
  try {
    const res = await fetch(SYNC_URL);
    if (res.ok) {
      data = await res.json();
      cloudOk = true;
    }
  } catch (err) {}

  let local = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) local = JSON.parse(raw);
  } catch (e) {}

  const cloudIdeas = (cloudOk && data && Array.isArray(data.ideas)) ? data.ideas : null;
  const localIdeas = (local && Array.isArray(local.ideas)) ? local.ideas : null;
  const cloudLooksLikeSamples = cloudIdeas && cloudIdeas.length > 0 &&
    cloudIdeas.every(i => String(i.id || '').startsWith('idea-sample-'));

  // Recovery: if cloud was wiped to samples but this browser still has the real board, restore it.
  if (localIdeas && localIdeas.length > 4 &&
      (!cloudIdeas || !cloudIdeas.length || cloudLooksLikeSamples || localIdeas.length > cloudIdeas.length)) {
    const localHasReal = localIdeas.some(i => !String(i.id || '').startsWith('idea-sample-'));
    if (localHasReal) {
      data = local;
      shouldRestoreToCloud = true;
    }
  } else if (cloudIdeas && cloudIdeas.length) {
    data = data;
  } else if (localIdeas && localIdeas.length) {
    data = local;
    shouldRestoreToCloud = cloudOk;
  }

  if (data && Array.isArray(data.ideas) && data.ideas.length) {
    DATA = normalizeLoaded(data);
    if (shouldRestoreToCloud) saveData();
  } else if (cloudOk && data && Array.isArray(data.ideas)) {
    DATA = normalizeLoaded(data);
  } else if (!cloudOk) {
    DATA = defaultData();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        ideas: DATA.ideas.map(i => ({ ...i })),
        sections: {
          preparation: (DATA.sections.preparation || []).map(c => ({ ...c })),
          execution: [], review: [], schedule: []
        }
      }));
    } catch (e) {}
  } else {
    DATA = defaultData();
    saveData();
  }

  if (ensureIdeaPositions()) scheduleSave();
  if (restackIdeasIfNeeded(false)) scheduleSave();
  renderBoard();
}

async function refreshData() {
  try {
    const res = await fetch(SYNC_URL);
    if (res.ok) {
      const remote = await res.json();
      if (remote && Array.isArray(remote.ideas)) {
        DATA = normalizeLoaded(remote);
        renderBoard();
      }
    }
  } catch (err) { console.warn('Refresh failed:', err); }
}

function toggleSection(id) {
  if (expandedSections.has(id)) expandedSections.delete(id);
  else expandedSections.add(id);
  renderBoard();
}

function addIdea(atX, atY) {
  const id = newId();
  const size = ideaCardSize(DATA.ideas.length + 1);
  const pos = (atX != null && atY != null)
    ? { x: Math.round(atX), y: Math.round(atY) }
    : placeNearMostRecent(size);
  DATA.ideas.push({
    id,
    body: '',
    cat: 'organic',
    imageData: null,
    x: pos.x,
    y: pos.y,
    createdAt: new Date().toISOString()
  });
  scheduleSave();
  renderBoard();
  focusWell(id);
}

function removeIdea(id) {
  DATA.ideas = DATA.ideas.filter(i => i.id !== id);
  restackIdeasIfNeeded(true);
  scheduleSave();
  renderBoard();
}

function readImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = IMAGE_MAX_EDGE;
        if (w > max || h > max) {
          const scale = max / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const mime = (file && file.type && file.type.startsWith('image/')) ? file.type : 'image/jpeg';
        const imageData = (mime === 'image/png') ? canvas.toDataURL(mime) : canvas.toDataURL(mime, 0.85);
        resolve({
          imageData,
          imageW: w,
          imageH: h
        });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function applyImageToIdea(ideaId, file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    const result = await readImageFile(file);
    const idea = DATA.ideas.find(i => i.id === ideaId);
    if (idea) {
      idea.imageData = result.imageData;
      idea.imageW = result.imageW;
      idea.imageH = result.imageH;
      scheduleSave();
      renderBoard();
      focusWell(ideaId);
    }
  } catch (err) { console.warn('Image load failed:', err); }
}

function clearWellFocus() {

function setupDropZone(el, onDrop) {
  el.addEventListener('dragover', e => {
    e.preventDefault();
    el.classList.add('drop-target');
  });
  el.addEventListener('dragleave', e => {
    if (!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
  });
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drop-target');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) onDrop(file, e);
  });
}

function renderIdeaCard(idea, cardSize) {
  const card = document.createElement('div');
  card.className = 'idea-card';
  card.dataset.ideaId = idea.id;
  card.style.setProperty('--card-size', cardSize + 'px');
  card.style.left = (idea.x || 0) + 'px';
  card.style.top = (idea.y || 0) + 'px';
  applyCardCategoryStyle(card, idea);

  const cat = idea.cat ? catById(idea.cat) : null;

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'card-delete';
  del.textContent = '×';
  del.title = 'Remove card';
  del.addEventListener('click', e => {
    e.stopPropagation();
    if (activeIdeaId === idea.id) closePanel();
    removeIdea(idea.id);
  });
  card.appendChild(del);

  const well = document.createElement('div');
  well.className = 'image-well' + (idea.imageData ? ' has-image' : '');
  well.dataset.ideaId = idea.id;
  well.tabIndex = 0;
  well.title = 'Click to paste · Ctrl+V / Cmd+V · or drop image';

  if (idea.imageData) {
    // Resize the thumbnail container to the image's aspect ratio so we don't
    // get large empty bars on the sides/bottom when using `object-fit: contain`.
    if (idea.imageW && idea.imageH) {
      const innerW = Math.max(64, cardSize - 14); // approximate padding/border
      let desiredH = Math.round((idea.imageH / idea.imageW) * innerW);
      // Allow taller portrait thumbnails. Too-low caps reintroduce side whitespace
      // when using `object-fit: contain`.
      desiredH = Math.max(56, Math.min(desiredH, Math.round(cardSize * 1.35)));
      well.style.height = desiredH + 'px';
    }
    const img = document.createElement('img');
    img.src = idea.imageData;
    img.alt = '';
    well.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.innerHTML = 'Click to paste<br>Ctrl+V / Cmd+V<br>or drop image';
    well.appendChild(ph);
  }

  well.addEventListener('click', e => {
    e.stopPropagation();
    focusWell(idea.id);
  });

  setupDropZone(well, file => applyImageToIdea(idea.id, file));
  card.appendChild(well);

  const preview = document.createElement('div');
  preview.className = 'card-preview';

  if (cat) {
    const catLabel = document.createElement('div');
    catLabel.className = 'card-cat-label';
    catLabel.textContent = cat.label;
    catLabel.style.color = accentTextColor(cat.bg);
    preview.appendChild(catLabel);
  }

  const descPreview = document.createElement('div');
  const plain = stripHtml(idea.body || '');
  descPreview.className = 'card-desc-preview' + (plain ? '' : ' empty');
  descPreview.textContent = plain || 'No description yet';
  preview.appendChild(descPreview);

  const details = document.createElement('span');
  details.className = 'card-details-link';
  details.textContent = 'View details';
  preview.appendChild(details);

  card.appendChild(preview);

  let suppressClick = false;
  let dragStartX = 0, dragStartY = 0, cardStartX = 0, cardStartY = 0;

  card.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.image-well') || e.target.closest('.card-delete')) return;
    suppressClick = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    cardStartX = idea.x;
    cardStartY = idea.y;
    card.classList.add('dragging');

    const onMove = ev => {
      const dx = (ev.clientX - dragStartX) / canvasZoom;
      const dy = (ev.clientY - dragStartY) / canvasZoom;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) suppressClick = true;
      idea.x = Math.round(Math.max(0, Math.min(CANVAS_W - cardSize, cardStartX + dx)));
      idea.y = Math.round(Math.max(0, Math.min(CANVAS_H - cardSize, cardStartY + dy)));
      card.style.left = idea.x + 'px';
      card.style.top = idea.y + 'px';
    };
    const onUp = () => {
      card.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (suppressClick) scheduleSave();
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    e.preventDefault();
  });

  card.addEventListener('click', e => {
    if (e.target.closest('.image-well') || e.target.closest('.card-delete')) return;
    if (suppressClick) { suppressClick = false; return; }
    openPanel(idea.id);
  });

  return card;
}

const ALLOWED_TAGS = ['B','STRONG','I','EM','U','BR','DIV','P','UL','OL','LI','SPAN'];

function sanitizeHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  tmp.querySelectorAll('*').forEach(node => {
    if (!ALLOWED_TAGS.includes(node.tagName)) {
      node.replaceWith(...node.childNodes);
      return;
    }
    [...node.attributes].forEach(attr => {
      const n = attr.name.toLowerCase();
      if (n.startsWith('on') || n === 'style' || n === 'class' || n === 'src' || n === 'href') {
        node.removeAttribute(attr.name);
      }
    });
  });
  return tmp.innerHTML;
}

  panelMode = 'idea';
  activeIdeaId = ideaId;
  activePrepId = null;
  buildIdeaPanelProps(idea);
  buildIdeaActions(idea);
  document.getElementById('prepExtraFields').style.display = 'none';
  document.getElementById('pDesc').innerHTML = sanitizeHtml(idea.body || '');
  setPanelImage(idea.imageData);
  updatePanelStrip(idea.cat);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('pDesc').focus(), 50);
}

function openPrepPanel(prepId) {
  const card = prepCards().find(c => c.id === prepId);
  if (!card) return;
  panelMode = 'prep';
  activePrepId = prepId;
  activeIdeaId = null;
  buildPrepPanelProps(card);
  buildPrepActions(card);
  document.getElementById('prepExtraFields').style.display = 'block';
  document.getElementById('pDesc').innerHTML = sanitizeHtml(card.body || '');
  document.getElementById('pPlan').innerHTML = sanitizeHtml(card.productionPlan || '');
  document.getElementById('pFit').innerHTML = sanitizeHtml(card.fitNote || '');
  setPanelImage(card.imageData);
  updatePanelStrip(card.pillar);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('pPlan').focus(), 50);
}

function savePanel(silent) {
  if (panelMode === 'idea' && activeIdeaId) {
    const idea = DATA.ideas.find(i => i.id === activeIdeaId);
    if (!idea) return;
    const catVal = document.getElementById('pCat').value;
    idea.cat = catVal || null;
    idea.body = sanitizeHtml(document.getElementById('pDesc').innerHTML).trim();

    if (prepareExpanded && !silent) {
      const pillarEl = document.getElementById('preparePillar');
      const formatEl = document.getElementById('prepareFormat');
      const pillar = (pillarEl && pillarEl.value) || idea.cat || 'organic';
      let format = formatEl && formatEl.value;
      if (!format) format = defaultFormatForPillar(pillar);
      moveIdeaToPrep(idea, pillar, format);
      return;
    }

    scheduleSave();
    renderBoard();
    if (!silent) closePanel();
    return;
  }
  if (panelMode === 'prep' && activePrepId) {
    const card = prepCards().find(c => c.id === activePrepId);
    if (!card) return;
    const pillar = document.getElementById('pPillar').value;
    const format = document.getElementById('pFormat').value;
    card.pillar = pillar;
    card.format = format || defaultFormatForPillar(pillar);
    card.body = sanitizeHtml(document.getElementById('pDesc').innerHTML).trim();
    card.productionPlan = sanitizeHtml(document.getElementById('pPlan').innerHTML).trim();
    card.fitNote = sanitizeHtml(document.getElementById('pFit').innerHTML).trim();
    scheduleSave();
    renderBoard();
    if (!silent) closePanel();
  }
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  activeIdeaId = null;
  activePrepId = null;
  panelMode = null;
  prepareExpanded = false;
  updateIdeaSaveBtn();
}

function fmtField(fieldId, command) {
  document.getElementById(fieldId).focus();
  document.execCommand(command, false, null);
}

function plainTextPaste(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
}
['pDesc', 'pPlan', 'pFit'].forEach(id => {
  document.getElementById(id).addEventListener('paste', plainTextPaste);
});

// ─── MOVE TO PREPARATION ─────────────────────────────────────────────────────

function moveIdeaToPrep(idea, pillar, format) {
  if (!idea) return;
  pillar = pillar || 'organic';
  if (!format) format = defaultFormatForPillar(pillar);

  const prepCard = {
    id: newPrepId(),
    sourceIdeaId: idea.id,
    body: idea.body || '',
    imageData: idea.imageData || null,
    imageW: idea.imageW,
    imageH: idea.imageH,
    pillar,
    format,
    productionPlan: '',
    fitNote: '',
    createdAt: idea.createdAt || new Date().toISOString(),
    movedAt: new Date().toISOString()
  };

  DATA.ideas = DATA.ideas.filter(i => i.id !== idea.id);
  prepCards().push(prepCard);
  restackIdeasIfNeeded(true);
  expandedSections.add('preparation');
  expandedPillars.add(pillar);
  closePanel();
  scheduleSave();
  renderBoard();
  openPrepPanel(prepCard.id);
}

ctxMenu.querySelector('[data-action="add-card"]').addEventListener('click', () => {
  hideCtxMenu();
  const x = ctxCanvasX, y = ctxCanvasY;
  ctxCanvasX = ctxCanvasY = null;
  addIdea(x, y);
});

document.addEventListener('keydown', e => {
  // Stop browsers from hijacking "/" for find/search while working on the board.
  if (e.key !== '/' && e.key !== '?') return;
  const t = e.target;
  const tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
  const editable = tag === 'input' || tag === 'textarea' || tag === 'select' ||
    (t && t.isContentEditable);
  if (!editable) e.preventDefault();
});

document.addEventListener('click', e => {
  hideCtxMenu();
  if (!e.target.closest('.image-well')) clearWellFocus();
});

document.addEventListener('paste', async e => {
  if (!focusedWellId) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      e.preventDefault();
      const file = items[i].getAsFile();
      if (file) await applyImageToIdea(focusedWellId, file);
      return;
    }
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (document.getElementById('panel').classList.contains('open')) return;
  refreshData();
});

initApp();
</script>
