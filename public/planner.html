<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPC - HOMEBASE · Annual Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F7F5F2;
      color: #2C2C2C;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #F7F5F2;
      color: #6B7A8D;
      padding: 16px 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid #e0ddd8;
    }
    .header-logo-link {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      line-height: 0;
    }
    .header-logo-link:hover { opacity: 0.72; }
    .header-logo {
      height: 28px;
      width: auto;
      max-width: min(280px, 52vw);
      display: block;
    }
    .header-right {
      text-align: right;
    }
    .header-right .sub {
      font-size: 11px;
      opacity: 0.55;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header-right .phase {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-top: 4px;
    }
    .header-right .version {
      font-size: 9px;
      letter-spacing: 0.06em;
      opacity: 0.35;
      margin-top: 3px;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 32px;
      background: #F7F5F2;
      border-bottom: 1px solid #e0ddd8;
      align-items: center;
    }

    /* TABLE */
    table {
      border-collapse: collapse;
      min-width: 1080px;
      width: 100%;
    }

    /* MONTH HEADERS */
    th {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 6px;
      text-align: center;
      color: #2C2C2C;
      background: #F0EDE8;
      border-bottom: 1px solid #E2DDD5;
      white-space: nowrap;
    }
    th:first-child {
      background: transparent;
      color: #6B7A8D;
      text-align: left;
      width: 150px;
      font-size: 10px;
    }
    th.now {
      background: #2C2C2C;
      color: #F7F5F2;
    }

    /* CATEGORY LABEL */
    .cat-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6B7A8D;
      padding: 12px 8px 12px 0;
      vertical-align: top;
      white-space: nowrap;
      border-top: 1px solid #e0ddd8;
      font-weight: 400;
    }

    /* EVENT CELL */
    .ecell {
      vertical-align: top;
      padding: 8px 4px;
      border-top: 1px solid #e0ddd8;
      border-left: 1px solid #ede9e3;
      min-height: 56px;
    }

    /* PILL */
    .pill {
      display: block;
      padding: 5px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      line-height: 1.35;
      margin-bottom: 4px;
      cursor: pointer;
      transition: filter 0.12s, opacity 0.12s;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      text-decoration: none;
      border: 1px solid #E2DDD5;
      position: relative;
      padding-right: 20px;
    }
    .pill:hover { filter: brightness(0.97); }
    .pill.pill--complete {
      opacity: 0.55;
      padding: 2px 18px 2px 6px;
      font-size: 10px;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .pill.pill--complete .pill-project { display: none; }
    .pill.pill--complete .pill-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill.pill--complete .pill-datemark { display: none; }
    .pill-del {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 15px;
      height: 15px;
      display: none;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 2px;
      background: rgba(44,44,44,0.08);
      color: #2C2C2C;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .pill:hover .pill-del { display: flex; }
    .pill-del:hover { background: #2C2C2C; color: #F7F5F2; }
    body.dark .pill-del { color: inherit; background: rgba(255,255,255,0.12); }

    /* REVENUE SECTION */
    .rev-section {
      padding: 28px 32px 36px;
    }
    .rev-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6B7A8D;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .rev-chart {
      width: 100%;
      max-width: 1200px;
      display: block;
      overflow: visible;
    }

    /* ── NOTION-STYLE PANEL ─────────────────────────────────────── */
    .panel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 400px;
      background: #fff;
      border-left: 1px solid #e8e5e0;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      z-index: 200;
      overflow-y: auto;
      box-shadow: -6px 0 28px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .panel.open { transform: translateX(0); }

    /* Panel header strip (category color) */
    .panel-strip {
      height: 5px;
      flex-shrink: 0;
    }

    /* Panel body */
    .panel-body-wrap {
      padding: 28px 28px 32px;
      flex: 1;
    }

    /* Close */
    .panel-close {
      position: absolute;
      top: 12px; right: 14px;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
      background: none;
      border: none;
      line-height: 1;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      transition: background 0.12s, color 0.12s;
    }
    .panel-close:hover { background: #f3f1ee; color: #555; }

    /* ── SETTINGS SIDEBAR ─────────────────────────────────────── */
    .settings-panel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 360px;
      max-width: 100%;
      background: #fff;
      border-left: 1px solid #E2DDD5;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      z-index: 220;
      display: flex;
      flex-direction: column;
      box-shadow: -6px 0 28px rgba(0,0,0,0.08);
    }
    .settings-panel.open { transform: translateX(0); }
    .settings-overlay {
      position: fixed; inset: 0;
      background: rgba(44,44,44,0.25);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s;
      z-index: 210;
    }
    .settings-overlay.open { opacity: 1; pointer-events: auto; }
    .settings-head {
      font-family: 'Forma DJR Display', 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #2C2C2C;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #E2DDD5;
    }
    .settings-tabs { display: flex; border-bottom: 1px solid #E2DDD5; }
    .settings-tab {
      flex: 1;
      padding: 10px 0 9px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6B7A8D;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .settings-tab:hover { color: #2C2C2C; }
    .settings-tab.active { color: #2C2C2C; border-bottom-color: #2C2C2C; }
    .settings-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .settings-item {
      padding: 10px 20px 10px 17px;
      border-left: 3px solid transparent;
      border-bottom: 1px solid #F0EDE8;
    }
    .settings-item-title { font-size: 12px; font-weight: 600; color: #2C2C2C; line-height: 1.35; }
    .settings-item-meta { font-size: 10px; color: #6B7A8D; letter-spacing: 0.04em; margin-top: 2px; }
    .settings-empty { padding: 22px 20px; font-size: 11px; color: #6B7A8D; }
    .settings-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid #E2DDD5;
    }
    .settings-toggle-label { font-size: 11px; color: #2C2C2C; line-height: 1.4; }
    .settings-toggle-label small { display: block; color: #6B7A8D; font-size: 9.5px; margin-top: 1px; }
    .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0;
      background: #E2DDD5;
      border-radius: 19px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .switch .slider::before {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 15px; height: 15px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    .switch input:checked + .slider { background: #2C2C2C; }
    .switch input:checked + .slider::before { transform: translateX(15px); }
    body.dark .settings-panel { background: #1e2538; border-left-color: #2e3a55; }
    body.dark .settings-head, body.dark .settings-item-title, body.dark .settings-toggle-label { color: #f0ede8; }
    body.dark .settings-head, body.dark .settings-tabs, body.dark .settings-toggle-row { border-color: #2e3a55; }
    body.dark .settings-item { border-bottom-color: #252e45; }
    body.dark .settings-tab.active { color: #f0ede8; border-bottom-color: #f0ede8; }
    body.dark .switch .slider { background: #2e3a55; }
    body.dark .switch input:checked + .slider { background: #c8c4be; }

    /* Status circle + title row */
    .panel-title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .panel-status-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid #ccc;
      flex-shrink: 0;
      margin-top: 7px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .panel-status-dot.done {
      background: #4E6E6C;
      border-color: #4E6E6C;
    }
    .panel-status-dot.done::after {
      content: '';
      position: absolute;
      width: 6px; height: 4px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      top: 50%; left: 50%;
      transform: translate(-50%, -65%) rotate(-45deg);
    }
    .panel-title-text {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.25;
      color: #1a1a1a;
      flex: 1;
      outline: none;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      padding: 2px 4px;
      border-radius: 4px;
      min-height: 32px;
    }
    .panel-title-text:focus {
      background: #f8f6f3;
    }
    .panel-title-text:empty::before {
      content: attr(placeholder);
      color: #bbb;
    }

    /* Properties */
    .panel-props {
      margin-bottom: 20px;
    }
    .prop-row {
      display: flex;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f0ede8;
      gap: 12px;
    }
    .prop-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #9a9a9a;
      width: 90px;
      flex-shrink: 0;
    }
    .prop-value {
      font-size: 13px;
      color: #2C2C2C;
      flex: 1;
    }
    .prop-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .prop-status-select {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #2C2C2C;
      padding: 3px 8px;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    .prop-status-select:focus { background: #f8f6f3; }
    .prop-status-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot-small {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prop-date-input {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      border: none;
      background: transparent;
      color: #2C2C2C;
      outline: none;
      width: 100%;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .prop-date-input:focus { background: #f8f6f3; }

    /* Divider */
    .panel-divider {
      border: none;
      border-top: 1px solid #ede9e3;
      margin: 18px 0;
    }

    /* Section headers */
    .panel-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #bbb;
      margin-bottom: 10px;
    }

    /* Description */
    .panel-desc {
      font-size: 13px;
      line-height: 1.75;
      color: #444;
      outline: none;
      min-height: 60px;
      padding: 4px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .panel-desc:focus { background: #f8f6f3; }
    .panel-desc:empty::before {
      content: attr(placeholder);
      color: #ccc;
    }

    /* Sub-tasks */
    .subtasks-list {
      list-style: none;
      margin-bottom: 10px;
    }
    .subtask-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 5px 0;
      border-bottom: 1px solid #f4f1ee;
    }
    .subtask-check {
      width: 15px; height: 15px;
      border-radius: 3px;
      border: 1.5px solid #ccc;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      position: relative;
    }
    .subtask-check:checked {
      background: #4E6E6C;
      border-color: #4E6E6C;
    }
    .subtask-check:checked::after {
      content: '';
      position: absolute;
      left: 2px; top: -1px;
      width: 8px; height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }
    .subtask-text {
      font-size: 13px;
      color: #2C2C2C;
      flex: 1;
      outline: none;
      line-height: 1.5;
    }
    .subtask-text:empty::before {
      content: 'Action item...';
      color: #ccc;
    }
    .subtask-del {
      font-size: 16px;
      color: #ccc;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      padding: 0 2px;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .subtask-item:hover .subtask-del { opacity: 1; }
    .subtask-del:hover { color: #e55; }

    .add-subtask-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #9a9a9a;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .add-subtask-btn:hover { color: #4E6E6C; }

    /* Save indicator */
    .panel-save-row {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #ede9e3;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-save {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 16px;
      background: #344364;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #2a3652; }
    .btn-cancel {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      padding: 7px 14px;
      background: transparent;
      color: #888;
      border: 1px solid #e0ddd8;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-cancel:hover { background: #f4f1ee; }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
    }
    .overlay.open { display: block; }

    /* VIEW TOGGLE */
    .nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px 56px 16px 32px;
      background: #F7F5F2;
      border-bottom: 1px solid #E2DDD5;
      position: relative;
    }
    .nav-link {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #6B7A8D;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .nav-link:hover { color: #2C2C2C; background: transparent; }
    .nav-link.active { color: #2C2C2C; background: transparent; font-weight: 600; }
    .nav-settings-btn {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: #6B7A8D;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .nav-settings-btn:hover { background: transparent; color: #2C2C2C; }

    /* PLUS BUTTON — horizontal grid cell */
    .add-event-btn {
      width: 22px; height: 22px;
      border-radius: 4px;
      border: 1.5px dashed #d0ccc6;
      background: transparent;
      color: #bbb;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      margin-top: 4px;
      transition: border-color 0.12s, color 0.12s;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .add-event-btn:hover { border-color: #6B7A8D; color: #6B7A8D; }

    /* VERTICAL LAYOUT */
    .v-wrap {
      display: block;
      padding: 20px 32px 36px;
    }
    .month-section {
      margin-bottom: 10px;
      border: 1px solid #e0ddd8;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .month-section--current { border-color: #2C2C2C; }
    .month-header {
      background: #F0EDE8;
      color: #2C2C2C;
      font-family: 'Forma DJR Display', 'Forma DJR Banner', 'Poppins', 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-bottom: 1px solid #E2DDD5;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .month-section--current .month-header { box-shadow: inset 3px 0 0 #4E6E6C; }
    .month-tabs { display: flex; gap: 4px; margin-left: auto; }
    .month-tab {
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #E2DDD5;
      background: transparent;
      color: #6B7A8D;
      font-size: 10px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.12s;
      letter-spacing: 0.04em;
      text-transform: none;
    }
    .month-tab:hover { border-color: #2C2C2C; color: #2C2C2C; }
    .month-tab.active { background: #2C2C2C; border-color: #2C2C2C; color: #F7F5F2; }
    .week-section { }
    .week-section + .week-section { border-top: 1px solid #f0ede8; }
    .week-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #344364;
      padding: 5px 12px 5px 16px;
      background: #f4f2ef;
      border-bottom: 1px solid #ece9e4;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .week-label:hover { background: #ede9e4; }
    .week-label.week-unassigned { color: #9aafb5; }
    .week-label.week-earlier { color: #8a8580; }
    .week-collapse-icon { font-size: 7px; margin-right: 6px; opacity: 0.6; }
    .week-label-text { flex: 1; }
    .week-earlier-body { display: flex; flex-direction: column; }
    .week-section--weekend .week-label { opacity: 0.72; }
    .week-add-area.week-day-row {
      min-height: 44px;
    }
    .week-add-area {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px 14px 6px 16px;
      gap: 5px;
      min-height: 32px;
      transition: background 0.12s, outline 0.12s;
    }
    .week-add-area.drop-target {
      background: rgba(71,133,137,0.08);
      outline: 2px dashed #4E6E6C;
      outline-offset: -3px;
      border-radius: 4px;
    }
    .cal-dow-header {
      display: grid;
      grid-template-columns: repeat(7, minmax(88px, 1fr));
      gap: 5px;
      padding: 8px 12px 2px;
      border-bottom: 1px solid #ece9e4;
    }
    .cal-dow-cell {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6B7A8D;
      text-align: center;
      padding: 2px 0 6px;
    }
    .cal-dow-cell--weekend { opacity: 0.55; }
    .week-day-num--today {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #4E6E6C;
      color: #F7F5F2 !important;
      margin-left: 0;
    }
    body.dark .cal-dow-header { border-bottom-color: #2e3a55; }
    body.dark .cal-dow-cell { color: #8a8580; }
    .week-section--nested + .week-section--nested { border-top: 1px solid #f0ede8; }
    .week-days-grid {
      display: grid;
      /* Always Sun–Sat (7 columns). Out-of-month cells use --na. */
      grid-template-columns: repeat(7, minmax(88px, 1fr));
      gap: 5px;
      padding: 4px 12px 10px;
      overflow-x: auto;
    }
    .week-day-col { display: flex; flex-direction: column; min-width: 0; }
    .week-day-header {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9eabc0;
      padding: 4px 4px 6px;
      text-align: center;
    }
    .week-day-num { color: #2C2C2C; font-weight: 700; margin-left: 0; font-size: 12px; }
    body.dark .week-day-num { color: #f0ede8; }
    /* Weekends are shown for a true calendar run, but sit back visually. */
    .week-day-col--weekend .week-day-header { opacity: 0.5; }
    .week-day-col--weekend .week-day-body { background: rgba(44,44,44,0.022); border-radius: 4px; }
    body.dark .week-day-col--weekend .week-day-body { background: rgba(255,255,255,0.03); }
    .pill-project {
      display: block; font-size: 8.5px; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; opacity: 0.62; margin-bottom: 1px; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pill-title { display: block; }
    .pill-datemark { float: right; font-size: 9px; opacity: 0.55; margin-left: 4px; line-height: 1.4; }
    .pill--dated { border-left-style: double; border-left-width: 4px; }
    .week-day-na { color: #cfc9bf; font-weight: 400; margin-left: 1px; }
    .week-day-col--na { opacity: 0.4; }
    .week-day-col--na .week-day-body { background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.025) 5px, rgba(0,0,0,0.025) 10px); }
    .week-day-col--bleed { opacity: 0.72; }
    .week-day-col--bleed .week-day-num { color: #6B7A8D; }
    .week-day-col--bleed.week-day-col--na { opacity: 0.72; }
    .week-day-col--bleed .week-day-body {
      background: rgba(78,110,108,0.04);
      border-radius: 4px;
    }
    .week-day-col--na .week-add-btn { display: none; }
    .week-day-body {
      flex: 1;
      min-height: 36px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .week-day-body.drop-target {
      background: rgba(71,133,137,0.08);
      border-color: #4E6E6C;
      outline: none;
    }
    .week-day-body .pill { display: block; width: 100%; box-sizing: border-box; }
    .week-day-body .week-add-btn { margin-top: 2px; }
    .pill[draggable="true"] { cursor: grab; }
    .pill.dragging { opacity: 0.3 !important; cursor: grabbing; }
    .week-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 4px;
      border: 1.5px dashed #d0ccc6;
      background: transparent;
      color: #bbb;
      font-size: 16px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      padding: 0;
      flex-shrink: 0;
    }
    .week-add-btn:hover { border-color: #6B7A8D; color: #6B7A8D; }
    /* CATEGORY PICKER */
    .cat-picker {
      position: fixed;
      background: #fff;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      padding: 6px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 210px;
    }
    .cat-picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      color: #1a1a1a;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
      transition: background 0.1s;
    }
    .cat-picker-item:hover { background: #f4f2ef; }
    .cat-picker-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    /* MONTH COLLAPSE BUTTON */
    .month-collapse-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 9px;
      cursor: pointer;
      padding: 0 8px 0 0;
      line-height: 1;
      transition: color 0.12s;
      flex-shrink: 0;
    }
    .month-collapse-btn:hover { color: #fff; }
    .v-table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
    }
    .v-table tr + tr .v-cat-label,
    .v-table tr + tr .v-evt-cell { border-top: 1px solid #f0ede8; }
    .v-cat-label {
      width: 170px;
      padding: 9px 10px 9px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #6B7A8D;
      font-weight: 400;
      vertical-align: top;
      white-space: nowrap;
    }
    .v-cat-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
      margin-top: -1px;
    }
    .v-evt-cell {
      padding: 7px 12px 7px 0;
      vertical-align: top;
    }
    .add-event-btn-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 4px;
      border: 1.5px dashed #d0ccc6;
      background: transparent;
      color: #bbb;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      padding: 0;
      vertical-align: top;
      margin-top: 2px;
    }
    .add-event-btn-inline:hover { border-color: #6B7A8D; color: #6B7A8D; }

    /* MOBILE */
    @media (max-width: 768px) {
      .header { padding: 14px 16px; }
      .header-logo { height: 24px; }
      .header-right .sub { font-size: 9px; }
      .toolbar { padding: 8px 16px; }
      .v-wrap { padding: 14px 12px 24px; }
      .v-cat-label { width: 100px; font-size: 9px; padding: 8px 6px 8px 12px; }
      .rev-section { padding: 16px 16px 24px; }
      .panel { width: 100%; }

      /* Day columns become a horizontally-scrollable strip instead of squeezing 6-up */
      .week-days-grid {
        display: flex;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 6px;
        scroll-snap-type: x proximity;
      }
      .week-day-col {
        flex: 0 0 108px;
        min-width: 108px;
        scroll-snap-align: start;
      }
      .week-day-header { font-size: 10px; padding: 0 4px 4px; }

      /* Slightly easier to tap without inflating the already-tight layout */
      .week-add-btn { width: 26px; height: 26px; }
    }

    /* DARK MODE BUTTON */
    .dark-mode-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #344364;
      background: transparent;
      color: #344364;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .dark-mode-btn:hover { background: #344364; color: #fff; }

    /* ── DARK MODE ──────────────────────────────────────────────────────── */
    body.dark { background: #141928; color: #f0ede8; }
    body.dark .header { background: #141928; border-bottom-color: #2e3a55; color: #8a8680; }
    body.dark .header-logo { filter: invert(1); }
    body.dark .toolbar { background: #141928; border-bottom-color: #2e3a55; }
    body.dark .nav-row { background: #1a1f2e; border-bottom-color: #2e3a55; }
    body.dark .nav-link { color: #8a8580; border: none; background: transparent; }
    body.dark .nav-link:hover, body.dark .nav-link.active { color: #f0ede8; background: transparent; }
    body.dark .nav-settings-btn { color: #8a8580; border: none; background: transparent; }
    body.dark .nav-settings-btn:hover { color: #f0ede8; background: transparent; }
    body.dark .dark-mode-btn { border-color: #4a5a7f; color: #c8c4be; }
    body.dark .dark-mode-btn:hover { background: #344364; color: #f0ede8; border-color: #344364; }
    body.dark th { background: #1e2538; color: #c8c4be; }
    body.dark th:first-child { background: transparent; color: #8a8680; }
    body.dark th.now { background: #1a3540; }
    body.dark .cat-label { color: #c8c4be; border-top-color: #2e3a55; }
    body.dark .ecell { border-top-color: #2e3a55; border-left-color: #1e2538; }
    body.dark .v-wrap { background: #141928; }
    body.dark .month-section { background: #1e2538; border-color: #2e3a55; }
    body.dark .month-header { background: #141d2e; color: #c8c4be; border-bottom-color: #2e3a55; }
    body.dark .month-tab { border-color: #2e3a55; color: #8a94ad; }
    body.dark .month-tab:hover { border-color: #c8c4be; color: #c8c4be; }
    body.dark .month-tab.active { background: #c8c4be; border-color: #c8c4be; color: #141928; }
    body.dark .month-section--current { border-color: #4E6E6C; }
    body.dark .month-section--current .month-header { box-shadow: inset 3px 0 0 #4E6E6C; }
    body.dark .v-table tr + tr .v-cat-label, body.dark .v-table tr + tr .v-evt-cell { border-top-color: #252e45; }
    body.dark .v-cat-label { color: #c8c4be; }
    body.dark .week-label { background: #141d2e; border-bottom-color: #252e45; color: #c8c4be; }
    body.dark .week-label:hover { background: #19223a; }
    body.dark .week-label.week-unassigned { color: #7a7570; }
    body.dark .week-label.week-earlier { color: #8a8580; }
    body.dark .week-day-header { color: #c8c4be; }
    body.dark .week-day-body { border-color: transparent; }
    body.dark .week-day-body.drop-target { background: rgba(71,133,137,0.12); border-color: #4E6E6C; }
    body.dark .add-event-btn-inline, body.dark .week-add-btn, body.dark .add-event-btn { border-color: #3e4f70; color: #7a7570; }
    body.dark .add-event-btn-inline:hover, body.dark .week-add-btn:hover, body.dark .add-event-btn:hover { border-color: #c8c4be; color: #f0ede8; }
    body.dark .rev-section { background: #141928; }
    body.dark .rev-title { color: #c8c4be; }
    body.dark .panel { background: #1e2538; border-left-color: #2e3a55; box-shadow: -6px 0 28px rgba(0,0,0,0.4); }
    body.dark .panel-close { color: #c8c4be; }
    body.dark .panel-close:hover { background: #252e45; color: #f0ede8; }
    body.dark .panel-title-text { color: #f0ede8; }
    body.dark .panel-title-text:focus { background: #252e45; }
    body.dark .panel-title-text:empty::before { color: #4a5a7f; }
    body.dark .prop-row { border-bottom-color: #252e45; }
    body.dark .prop-label { color: #c8c4be; }
    body.dark .prop-value { color: #f0ede8; }
    body.dark .prop-status-select { color: #f0ede8; }
    body.dark .prop-status-select:focus { background: #252e45; }
    body.dark .prop-date-input { color: #f0ede8; }
    body.dark .prop-date-input:focus { background: #252e45; }
    body.dark .panel-divider { border-top-color: #252e45; }
    body.dark .panel-section-label { color: #c8c4be; }
    body.dark .panel-desc { color: #f0ede8; }
    body.dark .panel-desc:focus { background: #252e45; }
    body.dark .panel-desc:empty::before { color: #4a5a7f; }
    body.dark .subtask-item { border-bottom-color: #252e45; }
    body.dark .subtask-text { color: #f0ede8; }
    body.dark .subtask-check { border-color: #3e4f70; }
    body.dark .add-subtask-btn { color: #c8c4be; }
    body.dark .add-subtask-btn:hover { color: #4E6E6C; }
    body.dark .panel-save-row { border-top-color: #252e45; }
    body.dark .btn-cancel { color: #c8c4be; border-color: #3e4f70; }
    body.dark .btn-cancel:hover { background: #252e45; }
    body.dark .cat-picker { background: #1e2538; border-color: #2e3a55; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
    body.dark .cat-picker-item { color: #f0ede8; }
    body.dark .cat-picker-item:hover { background: #252e45; }
    body.dark .add-section-btn { color: #c8c4be; }
    body.dark .add-section-btn:hover { color: #f0ede8; }
    /* ── VIEW-ONLY MODE (no edit-mode class on body) ── */
    body:not(.edit-mode) .week-add-btn,
    body:not(.edit-mode) .add-event-btn-inline,
    body:not(.edit-mode) .add-event-btn,
    body:not(.edit-mode) .add-section-btn,
    body:not(.edit-mode) .add-subtask-btn,

<div class="header">
  <div class="header-spacer"></div>
  <a class="header-logo-link" href="/" title="Home">
    <img class="header-logo" src="/assets/pressplay-logo-black.png?v=5" alt="Press Play Collective">
  </a>
  <div class="header-right">
    <div class="sub">Annual Planner — July 2026 to June 2027</div>
    <div class="phase">Phase 2</div>
    <div class="version" id="versionTag"></div>
  </div>
</div>

<div class="nav-row">
  <a class="nav-link active" href="/planner">Annual Planner</a>
  <a class="nav-link" href="/kanban">Task Board</a>
  <a class="nav-link" href="/marketing">Marketing</a>
  <button type="button" class="nav-settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div class="toolbar" id="plannerToolbar" style="display:none"></div>

<div class="v-wrap" id="verticalWrap"></div>

<div class="rev-section">
  <div class="rev-title">Monthly Revenue Target</div>
  <svg class="rev-chart" id="revChart" height="110"></svg>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Legacy projects/releases settings kept in DOM but unused this pass -->
<div class="settings-overlay" id="settingsOverlay" style="display:none"></div>
<div class="settings-panel" id="settingsPanel" style="display:none" aria-hidden="true">
  <button class="panel-close" onclick="closeSettings()" title="Close">&times;</button>
  <div class="settings-head">Settings</div>
  <div class="settings-tabs">
    <button class="settings-tab active" id="settingsTabProjects" onclick="setSettingsTab('projects')">Projects</button>
    <button class="settings-tab" id="settingsTabReleases" onclick="setSettingsTab('releases')">Product Releases</button>
  </div>
  <div class="settings-list" id="settingsList"></div>
  <div class="settings-toggle-row">
    <div class="settings-toggle-label">Auto-add new Task Board cards to this week
      <small>New kanban tasks without a due date land in Unassigned / Any</small>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoAssignToggle" onchange="toggleKanbanAutoAssign(this)">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-strip" id="panelStrip"></div>
  <button class="panel-close" id="panelClose" onclick="closePanel()">&#x2715;</button>

  <div class="panel-body-wrap">

    <!-- Title row -->
    <div class="panel-title-row">
      <div class="panel-status-dot" id="pStatusDot" onclick="toggleDone()"></div>
      <div class="panel-title-text" id="pTitle" contenteditable="true" placeholder="Event title..."></div>
    </div>

    <!-- Properties -->
    <div class="panel-props">
      <div class="prop-row">
        <span class="prop-label">Category</span>
        <span class="prop-value">
          <span class="prop-badge" id="pCatBadge"></span>
        </span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Status</span>
        <span class="prop-value">
          <div class="prop-status-wrap">
            <div class="status-dot-small" id="pStatusSmall"></div>
            <select class="prop-status-select" id="pStatus">
              <option value="planned">Planned</option>
              <option value="in-progress">In Progress</option>
              <option value="complete">Complete</option>
            </select>
          </div>
        </span>
      </div>
      <div class="prop-row" id="pProjectRow">
        <span class="prop-label">Project</span>
        <span class="prop-value">
          <div class="prop-status-wrap">
            <select class="prop-status-select" id="pProject"></select>
          </div>
        </span>
      </div>
      <div class="prop-row" id="pExactDateRow">
        <span class="prop-label">Date</span>
        <span class="prop-value">
          <div class="prop-status-wrap">
            <input type="date" class="prop-status-select" id="pExactDate" style="padding:4px 6px;" onchange="onExactDateChange()">
            <span class="exp-toggle" style="margin-left:8px;" onclick="clearExactDate()">clear</span>
          </div>
        </span>
      </div>
      <!-- Month / Week / Day are derived from the date above. Kept in the DOM
           (hidden) so placement still works for events with no date set. -->
      <div class="prop-row" id="pDateRow" style="display:none;">
        <span class="prop-label">Month</span>
        <span class="prop-value"><input class="prop-date-input" id="pDate" type="text"></span>
      </div>
      <div class="prop-row" id="pWeekRow" style="display:none;">
        <span class="prop-label">Week</span>
        <span class="prop-value"><select class="prop-status-select" id="pWeek"></select></span>
      </div>
      <!-- Day is a day-of-month number, derived from the date above. -->
      <div class="prop-row" id="pDayRow" style="display:none;">
        <span class="prop-label">Day</span>
        <span class="prop-value"><input id="pDay" type="text"></span>
      </div>
    </div>

    <hr class="panel-divider">

    <!-- Description -->
    <div class="panel-section-label">Description</div>
    <div class="panel-desc" id="pDesc" contenteditable="true" placeholder="Add a description..."></div>

    <!-- Sub-tasks -->
    <div class="panel-section-label">Action Items</div>
    <ul class="subtasks-list" id="subtaskList"></ul>
    <button class="add-subtask-btn" onclick="addSubtask()">
      <span style="font-size:16px;line-height:1">+</span> Add action item
    </button>

    <!-- Save -->
    <div class="panel-save-row">
      <button class="btn-cancel" onclick="closePanel()">Cancel</button>
      <button class="btn-save" onclick="savePanel()">Save changes</button>
    </div>

  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const MONTHS = [
  'Jul 2026','Aug 2026','Sep 2026','Oct 2026','Nov 2026','Dec 2026',
  'Jan 2027','Feb 2027','Mar 2027','Apr 2027','May 2027','Jun 2027'
];

// Brand palette v4 (Colour & Identity Document 2026 v4): muted tertiary family,
// Signal Yellow retired. Finance has no brand slot — dusty rust derived to fit the family.

// v3 → v4 colour migration for categories already saved in the cloud payload.
const CAT_COLOR_MIGRATION = {
  '#478589': '#4E6E6C',
  '#edd960': '#C29A3B',
  '#6b5a9c': '#564A5E',
  '#d4763b': '#8A5A3B',
};
function migrateCatColors(cats) {
  let changed = false;
  cats.forEach(c => {
    const next = CAT_COLOR_MIGRATION[(c.bg || '').toLowerCase()];
    if (next) { c.bg = next; changed = true; }
  });
  return changed;
}

// Pills use a single calm background; the category color becomes an accent
// (left border + title text) instead of a full-color fill.
const PILL_BG = '#F0EDE8';
function accentTextColor(bg) {
  // Yellows/mustards are too low-contrast as text — fall back to Graphite
  // (the coloured left bar still carries the category).
  const b = bg.toLowerCase();
  return (b === '#edd960' || b === '#c29a3b') ? '#2C2C2C' : bg;
}

const STORAGE_KEY = 'ppc-planner-data';
const SYNC_URL = '/api/data';
const APP_VERSION = '2.10.4';

let SETTINGS = { kanbanAutoAssign: true };

// Bumped when the meaning of an event's `week` number changes. Scheme 2 = real
// Monday-start calendar weeks (scheme 1 was day-number buckets).
const WEEK_SCHEME = 5;

function saveToFirestore() {
  const payload = {
    cats:   CATS.map(c => ({ ...c })),
    events: EVENTS.map(e => ({ ...e })),
    settings: { ...SETTINGS },
    weekScheme: WEEK_SCHEME
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (err) {
    console.warn('Local save failed:', err);
  }
  fetch(SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    cache: 'no-store'
  }).catch(err => console.warn('Cloud sync failed:', err));
}

async function initApp() {
  let data = null;
  try {
    const res = await fetch(SYNC_URL, { cache: 'no-store' });
    if (res.ok) {
      const remote = await res.json();
      if (remote && remote.cats && remote.cats.length) data = remote;
    }
  } catch (err) {
    console.warn('Cloud fetch failed, falling back to local storage:', err);
  }
  if (!data) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (err) {
      console.warn('Could not load saved data:', err);
    }
  }
  if (data) {
    if (data.cats   && data.cats.length)   { CATS.length   = 0; data.cats.forEach(c   => CATS.push(c));   }
    if (data.events && data.events.length) { EVENTS.length = 0; data.events.forEach(e => EVENTS.push(e)); }
    if (data.settings) Object.assign(SETTINGS, data.settings);
    let dirty = migrateCatColors(CATS);
    // Convert week numbers from the old day-bucket scheme, preserving the real
    // calendar date each event was already sitting on.
    const stored = data.weekScheme || 1;
    if (stored < WEEK_SCHEME) { migrateWeekScheme(stored); dirty = true; }
    EVENTS.forEach(e => {
      if (e.day == null && e.week != null) { e.week = null; dirty = true; }
    });
    if (dirty) saveToFirestore();
  }
  // Pull dated Task Board cards onto the timeline (and push dated timeline
  // events back), so both boards show the same item on the same day.
  if (await syncDateMirrors()) saveToFirestore();   // also refreshes localStorage
  renderVertical();
}

const MONTH_VIEW_KEY = 'ppc-planner-month-views';

function plannerMonthIndexNow() {
  const now = new Date();
  return (now.getFullYear() - 2026) * 12 + now.getMonth() - 6;
}

function defaultMonthViewMode(mi) {
  // Future months open in Overview; current + past default to Calendar (date list).
  return mi > plannerMonthIndexNow() ? 'overview' : 'week';
}

function persistMonthViewModes() {
  try { localStorage.setItem(MONTH_VIEW_KEY, JSON.stringify({ ...monthViewModes })); }
  catch (err) { console.warn('Could not save month view prefs:', err); }
}

const monthViewModes = {};
(function initMonthViewModes() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(MONTH_VIEW_KEY) || 'null'); }
  catch (err) { saved = null; }
  for (let i = 0; i < 12; i++) {
    if (saved && (saved[i] === 'week' || saved[i] === 'overview')) monthViewModes[i] = saved[i];
    else monthViewModes[i] = defaultMonthViewMode(i);
  }
})();

function renderVertical() {
  const wrap = document.getElementById('verticalWrap');
  wrap.innerHTML = '';

  MONTHS.forEach((monthName, mi) => {
    const section = document.createElement('div');
    section.className = 'month-section' + (mi === plannerMonthIndexNow() ? ' month-section--current' : '');
    section.id = 'month-section-' + mi;

    // Header with collapse button + tabs
    const mHead = document.createElement('div');
    mHead.className = 'month-header';
    const colBtn = document.createElement('button');
    colBtn.className = 'month-collapse-btn';
    colBtn.textContent = monthCollapsed[mi] ? '▶' : '▼';
    colBtn.onclick = (e) => { e.stopPropagation(); toggleMonthCollapse(mi); };
    mHead.appendChild(colBtn);
    const mTitle = document.createElement('span');
    mTitle.textContent = monthName;
    mHead.appendChild(mTitle);

    const tabs = document.createElement('div');
    tabs.className = 'month-tabs';
    const tabOv = document.createElement('button');
    tabOv.className = 'month-tab' + (monthViewModes[mi] !== 'week' ? ' active' : '');
    tabOv.textContent = 'Overview';
    tabOv.onclick = (e) => { e.stopPropagation(); monthViewModes[mi] = 'overview'; persistMonthViewModes(); refreshMonthContent(mi); };
    const tabWk = document.createElement('button');
    tabWk.className = 'month-tab' + (monthViewModes[mi] === 'week' ? ' active' : '');
    tabWk.textContent = 'Calendar';
    tabWk.onclick = (e) => { e.stopPropagation(); monthViewModes[mi] = 'week'; persistMonthViewModes(); refreshMonthContent(mi); };
    tabs.appendChild(tabOv);
    tabs.appendChild(tabWk);
    mHead.appendChild(tabs);
    section.appendChild(mHead);

    const contentWrap = document.createElement('div');
    contentWrap.id = 'month-content-' + mi;
    if (monthCollapsed[mi]) contentWrap.style.display = 'none';
    section.appendChild(contentWrap);

    wrap.appendChild(section);
    if (!monthCollapsed[mi]) refreshMonthContent(mi);
  });
}

function refreshMonthContent(mi) {
  const contentWrap = document.getElementById('month-content-' + mi);
  if (!contentWrap) return;
  contentWrap.innerHTML = '';
  // Sync tab active states
  const section = document.getElementById('month-section-' + mi);
  if (section) {
    const [tabOv, tabWk] = section.querySelectorAll('.month-tab');
    if (monthViewModes[mi] === 'week') {
      tabOv.classList.remove('active'); tabWk.classList.add('active');
    } else {
      tabOv.classList.add('active'); tabWk.classList.remove('active');
    }
  }
  if (monthViewModes[mi] === 'week') {
    renderMonthWeeks(contentWrap, mi);
  } else {
    renderMonthOverview(contentWrap, mi);
  }
}

  addSecBtn.onmouseenter = () => { if (!addSecBtn.style.color.includes('478589')) addSecBtn.style.color = '#6B7A8D'; };
  addSecBtn.onmouseleave = () => { addSecBtn.style.color = '#bbb'; };
  addSecBtn.onclick = (e) => { e.stopPropagation(); showAddSectionPicker(addSecBtn, mi); };
  addSecCell.appendChild(addSecBtn);
  addSecRow.appendChild(addSecCell);
  table.appendChild(addSecRow);

  container.appendChild(table);
}

const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ─── WEEK BANDS ──────────────────────────────────────────────────────────────
   True Sunday–Saturday weeks owned by the month of their Sunday. Always 7
   columns; days in the adjacent month are live bleed cells (so July has 4
   weeks, not 5 — early July days sit in June's last week).

   scheme 5: week = Sun–Sat week starting in this month,
             day  = day-of-month (null + week null = Unassigned / Any) */

const DAY_DOW = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const DOW_LABELS = { 0: 'Sun', 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat' };

// The planner year runs Jul 2026 (mi=0) → Jun 2027 (mi=11).
function monthYear(mi) { return 2026 + Math.floor((6 + mi) / 12); }
function monthIndex(mi) { return (6 + mi) % 12; }
function daysInMonth(mi) { return new Date(monthYear(mi), monthIndex(mi) + 1, 0).getDate(); }

function plannerMiFromParts(y, m) {
  return (y - 2026) * 12 + m - 6;
}

function isoFromMonthDay(mi, d) {
  return monthYear(mi) + '-' + String(monthIndex(mi) + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* Sun–Sat weeks starting in this month. A leading week is added only when
   its Sunday is before the planner year (July needs this for Jul 1–4). Later
   months get early days via the previous month's trailing bleed — no duplicate
   rows. Trailing weeks bleed into the next month as live cells. */
function monthWeekBands(mi) {
  const y = monthYear(mi), m = monthIndex(mi), last = daysInMonth(mi);
  const bands = [];
  let key = 1;
  const firstDow = new Date(y, m, 1).getDay();
  // Leading week only when its Sunday sits outside the planner year (e.g. late
  // June before Jul 2026). Otherwise that week already lives in the previous
  // month section and bleeds forward — avoid duplicating it here.
  if (firstDow !== 0) {
    const start = 1 - firstDow;
    const sun = new Date(y, m, start);
    const sunMi = plannerMiFromParts(sun.getFullYear(), sun.getMonth());
    if (sunMi < 0) {
      bands.push({ key, from: start, to: start + 6 });
      key += 1;
    }
  }
  for (let d = 1; d <= last; d++) {
    if (new Date(y, m, d).getDay() !== 0) continue;
    bands.push({ key, from: d, to: d + 6 });
    key += 1;
  }
  return bands;
}

function bandForDate(mi, d) {
  if (d == null) return null;
  return monthWeekBands(mi).find(b => d >= b.from && d <= b.to) || null;
}

function bandLabelRange(mi, band) {
  const last = daysInMonth(mi);
  const y = monthYear(mi), m = monthIndex(mi);
  const end = new Date(y, m, band.to);
  const endInMonth = end.getMonth() === m && end.getFullYear() === y;
  return {
    from: band.from,
    to: endInMonth ? end.getDate() : last,
    bleedsNext: !endInMonth
  };
}

// Always seven Sun–Sat columns. Adjacent-month days are live bleed cells.
function dayColumnsForBand(mi, band) {
  if (!band) return [];
  const y = monthYear(mi), m = monthIndex(mi), cols = [];
  for (let offset = 0; offset < 7; offset++) {
    const cell = new Date(y, m, band.from + offset);
    const cy = cell.getFullYear(), cm = cell.getMonth(), cd = cell.getDate();
    const inSection = cy === y && cm === m;
    const cellMi = plannerMiFromParts(cy, cm);
    const inPlanner = cellMi >= 0 && cellMi <= 11;
    const dow = cell.getDay();
    cols.push({
      date: cd,
      cellMi: inPlanner ? cellMi : null,
      outside: !inSection,
      bleed: !inSection && inPlanner,
      inert: !inSection && !inPlanner,
      dow,
      label: DOW_LABELS[dow],
      weekend: dow === 0 || dow === 6
    });
  }
  return cols;
}

// 1st / 2nd / 3rd … 11th–13th are the exceptions to the digit rule.
function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
}

/* Convert stored placement to the current scheme, preserving the real calendar
   date each event is already shown on. Runs once per scheme bump.

   scheme 1: week = day-bucket,      day = 'mon'…'fri'
   scheme 2: week = real Mon–Sun week, day = 'mon'…'fri'
   scheme 3: week = day-bucket (1–7/8–14…), day = date number
   scheme 4: week = Sun–Sat intersecting month (incl. leading empty cells)
   scheme 5: week = Sun–Sat starting in month; adjacent days bleed live */
function migrateWeekScheme(fromScheme) {
  const y = mi => monthYear(mi), mo = mi => monthIndex(mi);

  EVENTS.forEach(e => {
    if (e.m == null) return;
    const last = daysInMonth(e.m);

    // Work out the real date this event currently sits on.
    let date = null;
    if (typeof e.day === 'number') {
      date = e.day;                                  // already scheme 3
    } else if (e.day && e.week != null) {
      const dow = DAY_DOW[e.day];
      let from, to;
      if (fromScheme >= 2) {
        // Scheme 2 bands were real Mon–Sun weeks; rebuild the one it was in.
        let d = 1, k = 0;
        while (d <= last) {
          const wd = new Date(y(e.m), mo(e.m), d).getDay();
          const end = Math.min(d + (wd === 0 ? 0 : 7 - wd), last);
          if (++k === e.week) { from = d; to = end; break; }
          d = end + 1;
        }
      } else {
        from = (e.week - 1) * 7 + 1;
        to = e.week === 4 ? last : e.week * 7;
      }
      if (from != null) {
        for (let d = from; d <= Math.min(to, last); d++) {
          if (new Date(y(e.m), mo(e.m), d).getDay() === dow) { date = d; break; }
        }
      }
    }

    if (date != null) {
      e.day = date;
      const band = bandForDate(e.m, date);
      e.week = band ? band.key : 1;
    } else {
      // No specific day — former "Any" column cards park in Unassigned / Any.
      e.day = null;
      e.week = null;
    }
  });
}

/* ─── DATE MIRRORING (Task Board ⇄ Timeline) ──────────────────────────────────
   Any pill carrying a date sits on the timeline at exactly that date, and the
   same item shows on both boards. Links are by id (`srcCardId` / `srcEventId`),
   reconciled here in one pass so the two stores can never drift or loop. */

const KANBAN_URL = '/api/kanban';
const KANBAN_PATCH_URL = KANBAN_URL + '/patch';

// Task Board projects, cached so the timeline can label pills and offer the
// same project list without refetching.
let BOARD_PROJECTS = [];
function projectName(id) {
  const p = BOARD_PROJECTS.find(x => x.id === id);
  return p ? p.name : null;
}

// Single-card writes to the board. Server-side merge keeps fields we don't send
// (column, assignees) and avoids clobbering the whole board.
async function patchBoard(upsert, remove) {
  try {
    const res = await fetch(KANBAN_PATCH_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ upsert: upsert || [], remove: remove || [] }),
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('Task Board patch HTTP ' + res.status);
    return true;
  } catch (err) {
    console.warn('Task Board patch failed:', err);
    return false;
  }
}

// A real date → the timeline slot representing it. Every day of the week has a
// column now, so any date maps straight onto its own.
function dateToPlannerSlot(iso) {
  if (!iso) return null;
  const [y, mo, d] = iso.split('-').map(Number);
  if (!y || !mo || !d) return null;
  const mi = (y - 2026) * 12 + (mo - 1) - 6;
  if (mi < 0 || mi > 11) return null;
  const band = bandForDate(mi, d);
  // Day is enough to place; week may be null for leading days before the first Sunday.
  return { m: mi, week: band ? band.key : null, day: d };
}

// The inverse: a timeline slot → the date it represents.
function slotToDate(mi, week, day) {
  if (mi == null) return null;
  if (typeof day === 'number') return isoFromMonthDay(mi, day);
  if (week == null) return null;
  const band = monthWeekBands(mi).find(b => b.key === week);
  if (!band) return null;
  return isoFromMonthDay(mi, band.from);
}

function stripHtml(html) {
  const t = document.createElement('div');
  t.innerHTML = html || '';
  return (t.textContent || '').trim();
}

// Timeline events need stable ids so the Task Board can link back to them.
function ensureEventIds() {
  let changed = false;
  EVENTS.forEach(e => {
    if (!e.id) { e.id = 'e' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); changed = true; }
  });
  return changed;
}

function statusToColumn(status) {
  return status === 'complete' ? 'done' : status === 'in-progress' ? 'active' : 'backlog';
}

/* Reconcile both directions in a single pass, then write each store once. */
async function syncDateMirrors(opts) {
  const options = opts || {};
  const preferLocalIds = options.preferLocalIds instanceof Set
    ? options.preferLocalIds
    : new Set(options.preferLocalId ? [options.preferLocalId] : []);

  let board = null;
  try {
    const res = await fetch(KANBAN_URL, { cache: 'no-store' });
    if (res.ok) board = await res.json();
  } catch (err) { return false; }                      // offline: leave mirrors alone
  if (!board || !Array.isArray(board.cards)) return false;
  BOARD_PROJECTS = Array.isArray(board.projects) ? board.projects : [];

  let eventsChanged = ensureEventIds();
  const liveCardIds = new Set(board.cards.map(c => c.id));

  // ── Task Board → Timeline ────────────────────────────────────────────────
  const datedCards = new Map();
  board.cards.forEach(c => { if (c.dueDate && !c.srcEventId) datedCards.set(c.id, c); });

  for (let i = EVENTS.length - 1; i >= 0; i--) {
    const e = EVENTS[i];
    if (!e.srcCardId) continue;
    // Drop mirrors whose Task Board card was deleted.
    if (!liveCardIds.has(e.srcCardId)) {
      EVENTS.splice(i, 1); eventsChanged = true;
      continue;
    }
    if (!datedCards.has(e.srcCardId)) {
      // Undated (or date cleared) → keep parked in Unassigned / Any.
      if (e.week != null || e.day != null || e.dueDate) {
        e.week = null; e.day = null; delete e.dueDate;
        eventsChanged = true;
      }
    }
  }
  datedCards.forEach((card, id) => {
    const slot = dateToPlannerSlot(card.dueDate);
    const idx = EVENTS.findIndex(e => e.srcCardId === id);
    if (!slot) {
      if (idx >= 0) {
        const e = EVENTS[idx];
        if (preferLocalIds.has(e.id)) return;
        e.week = null; e.day = null; delete e.dueDate;
        eventsChanged = true;
      }
      return;
    }
    const next = {
      srcCardId: id, mirrored: true,
      cat: CATS.some(c => c.id === card.cat) ? card.cat : CATS[0].id,
      m: slot.m, week: slot.week, day: slot.day,
      title: card.title || 'Untitled task', date: MONTHS[slot.m],
      body: stripHtml(card.body), status: card.status || 'planned',
      tasks: (card.tasks || []).slice(), dueDate: card.dueDate,
      project: card.project || null
    };
    if (idx < 0) { next.id = 'mir-' + id; EVENTS.push(next); eventsChanged = true; return; }
    const e = EVENTS[idx];
    if (preferLocalIds.has(e.id)) return; // just saved from the panel — don't clobber
    if (['cat','m','week','day','title','status','body','dueDate','project'].some(f => e[f] !== next[f])) {
      Object.assign(e, next); eventsChanged = true;
    }
  });

  // ── Timeline → Task Board ────────────────────────────────────────────────
  // A dated timeline event gets its own card, so the item lives on both boards.
  // Writes go through the single-card patch endpoint, never a whole-board POST.
  const datedEvents = EVENTS.filter(e => e.dueDate && !e.srcCardId);
  const liveEventIds = new Set(datedEvents.map(e => e.id));
  const upserts = [];
  const removals = board.cards
    .filter(c => c.srcEventId && !liveEventIds.has(c.srcEventId))
    .map(c => c.id);

  datedEvents.forEach(evt => {
    const existing = board.cards.find(c => c.srcEventId === evt.id);
    const desired = {
      id: existing ? existing.id : 'kmir-' + evt.id,
      srcEventId: evt.id, mirrored: true,
      title: evt.title, cat: evt.cat, status: evt.status || 'planned',
      dueDate: evt.dueDate, project: evt.project || undefined
    };
    if (!existing) {
      // Only set these on creation — afterwards they're the board's to own.
      desired.column = statusToColumn(evt.status);
      desired.body = evt.body || '';
      desired.tasks = (evt.tasks || []).slice();
      desired.assignees = [];
      upserts.push(desired);
    } else if (['title','cat','status','dueDate','project'].some(f => existing[f] !== desired[f])) {
      desired.column = statusToColumn(evt.status);
      // Keep body/tasks in sync when the planner panel just saved this event.
      if (preferLocalIds.has(evt.id)) {
        desired.body = evt.body || '';
        desired.tasks = (evt.tasks || []).slice();
      }
      upserts.push(desired);
    }
  });

  if (upserts.length || removals.length) await patchBoard(upserts, removals);

  return eventsChanged;
}

// Write a date back to a linked card (null clears it, retiring the mirror).
// Single-card patch — never rewrites the rest of the board.
async function pushDueDateToCard(cardId, iso) {
  await patchBoard([{ id: cardId, dueDate: iso || null }], []);
}

async function pushStatusToCard(cardId, status) {
  if (!cardId) return;
  const patch = { id: cardId, status: status || 'planned' };
  patch.column = statusToColumn(status);
  if (status === 'complete') patch.doneAt = new Date().toISOString();
  await patchBoard([patch], []);
}

/** Push all editable fields from a linked timeline pill back to its Task Board card. */
async function pushEventToCard(evt) {
  if (!evt || !evt.srcCardId) return true;
  const patch = {
    id: evt.srcCardId,
    title: evt.title || 'Untitled task',
    body: evt.body || '',
    tasks: Array.isArray(evt.tasks) ? evt.tasks.slice() : [],
    status: evt.status || 'planned',
    column: statusToColumn(evt.status),
    dueDate: evt.dueDate || null,
    project: evt.project || null
  };
  if (evt.status === 'complete') patch.doneAt = new Date().toISOString();
  return patchBoard([patch], []);
}

function showToast(msg) {
  let el = document.getElementById('ppcToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ppcToast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;background:#2C2C2C;color:#F7F5F2;font-family:DM Sans,sans-serif;font-size:13px;padding:10px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.2);max-width:90vw;opacity:0;transition:opacity 0.2s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.opacity = '0'; }, 3200);
}

/* Every slot change funnels through here so a dated pill's date follows it. */
async function applyEventSlot(evt, week, dayKey, cellMi) {
  if (cellMi != null && cellMi !== evt.m) {
    evt.m = cellMi;
    evt.date = MONTHS[cellMi];
  }
  evt.day = dayKey;
  if (typeof dayKey === 'number') {
    const band = bandForDate(evt.m, dayKey);
    evt.week = band ? band.key : null;
  } else {
    evt.week = week;
    evt.day = null;
  }
  const iso = typeof dayKey === 'number' ? isoFromMonthDay(evt.m, dayKey) : null;
  if (evt.dueDate || evt.srcCardId) {
    if (iso) evt.dueDate = iso; else delete evt.dueDate;
  }
  if (evt.srcCardId) await pushDueDateToCard(evt.srcCardId, iso);
}

function attachPillDelete(pill, evt, mi) {
  const del = document.createElement('button');
  del.className = 'pill-del';
  del.innerHTML = '&times;';
  del.title = 'Delete event';
  del.onclick = async (e) => {
    e.stopPropagation();
    const linked = !!evt.srcCardId;
    const msg = linked
      ? 'Remove "' + evt.title + '" from the timeline? It stays on the Task Board, just without a due date.'
      : 'Delete "' + evt.title + '"? You can recover it from Settings → Archive for 30 days.';
    if (!confirm(msg)) return;
    if (linked) {
      pushDueDateToCard(evt.srcCardId, null);
    } else {
      try {
        const snap = JSON.parse(JSON.stringify(evt));
        if (!snap.id) snap.id = 'e' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
        evt.id = snap.id;
        await PPC.archivePush({
          source: 'planner',
          item: snap,
          restoreMeta: { m: evt.m, week: evt.week, day: evt.day },
          label: evt.title || 'Untitled event'
        });
      } catch (_) {}
    }
    const i = EVENTS.indexOf(evt);
    if (i > -1) EVENTS.splice(i, 1);
    saveToFirestore();
    if (mi != null) refreshMonthContent(mi);
    else renderVertical();
  };
  pill.appendChild(del);
}

function makePill(evt, mi) {
  const cat = CATS.find(c => c.id === evt.cat);
  if (!cat) return document.createTextNode('');
  const pill = document.createElement('span');
  pill.className = 'pill';
  setPillLabel(pill, evt, accentTextColor(cat.bg));
  pill.style.background = PILL_BG;
  pill.style.borderLeft = '3px solid ' + cat.bg;
  pill.style.color = accentTextColor(cat.bg);
  pill.style.fontWeight = '600';
  pill.style.cursor = 'grab';
  if (evt.status === 'complete') pill.classList.add('pill--complete');
  // Native HTML5 drag doesn't work via touch and blocks the scroll gesture instead — skip it on touch devices.
  pill.draggable = !IS_TOUCH;
  pill.addEventListener('dragstart', (e) => {
    if (!editMode) { e.preventDefault(); return; }
    _dragEvt = evt; _dragMi = mi;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => pill.classList.add('dragging'), 0);
  });
  pill.addEventListener('dragend', () => {
    pill.classList.remove('dragging');
    _dragEvt = null; _dragMi = null;
  });
  if (IS_TOUCH) attachTouchDrag(pill, evt, mi);
  pill.addEventListener('click', e => { e.stopPropagation(); if (_touchJustDragged) return; openPanel(evt, cat); });
  markDatedPill(pill, evt);
  attachPillDelete(pill, evt, mi);
  return pill;
}

// Project name sits in small text above the title, so it's clear at a glance
// what the item belongs to.
function setPillLabel(pill, evt, accent) {
  pill.textContent = '';
  const proj = projectName(evt.project);
  if (proj) {
    const tag = document.createElement('span');
    tag.className = 'pill-project';
    tag.textContent = proj;
    pill.appendChild(tag);
  }
  const title = document.createElement('span');
  title.className = 'pill-title';
  title.textContent = evt.title;
  pill.appendChild(title);
}

// Pills pinned to a date get a marker; ones linked to a Task Board card say so.
function markDatedPill(pill, evt) {
  if (!evt.dueDate && !evt.srcCardId) return;
  const tag = document.createElement('span');
  tag.className = 'pill-datemark';
  tag.textContent = evt.srcCardId ? '⇄' : '◆';
  tag.title = evt.srcCardId
    ? 'Linked to the Task Board — moving it here updates the task\'s due date'
    : 'Pinned to ' + evt.dueDate;
  pill.appendChild(tag);
  pill.classList.add('pill--dated');
}

// ── Touch drag: hold a pill ~half a second to pick it up, drag to a day/week cell ──
let _touchGhost = null;
let _touchTarget = null;
let _touchJustDragged = false;

function attachTouchDrag(pill, evt, mi) {
  let timer = null, dragging = false, startX = 0, startY = 0;

  const cleanup = () => {
    clearTimeout(timer); timer = null;
    if (_touchGhost) { _touchGhost.remove(); _touchGhost = null; }
    if (_touchTarget) { _touchTarget.classList.remove('drop-target'); _touchTarget = null; }
    pill.classList.remove('dragging');
    dragging = false;
    _dragEvt = null; _dragMi = null;
  };

  pill.addEventListener('touchstart', (e) => {
    if (!editMode) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    timer = setTimeout(() => {
      dragging = true;
      _dragEvt = evt; _dragMi = mi;
      pill.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(30);
      _touchGhost = pill.cloneNode(true);
      _touchGhost.classList.remove('dragging');
      _touchGhost.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;opacity:0.92;box-shadow:0 6px 18px rgba(0,0,0,0.3);width:' + pill.offsetWidth + 'px;left:' + (startX - pill.offsetWidth / 2) + 'px;top:' + (startY - 34) + 'px;margin:0;';
      document.body.appendChild(_touchGhost);
    }, 450);
  }, { passive: true });

  pill.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (!dragging) {
      // Finger moved before the hold completed — it's a scroll, not a drag.
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) { clearTimeout(timer); timer = null; }
      return;
    }
    e.preventDefault();
    _touchGhost.style.left = (t.clientX - _touchGhost.offsetWidth / 2) + 'px';
    _touchGhost.style.top = (t.clientY - 34) + 'px';
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const target = el && el.closest('[data-drop-mi]');
    if (_touchTarget && _touchTarget !== target) _touchTarget.classList.remove('drop-target');
    const tMi = target && target.dataset.dropMi !== '' ? parseInt(target.dataset.dropMi) : NaN;
    _touchTarget = (target && !isNaN(tMi) && tMi >= 0 && tMi <= 11) ? target : null;
    if (_touchTarget) _touchTarget.classList.add('drop-target');
  }, { passive: false });

  pill.addEventListener('touchend', async () => {
    if (!dragging) { clearTimeout(timer); timer = null; return; }
    _touchJustDragged = true;
    setTimeout(() => { _touchJustDragged = false; }, 400);
    if (_touchTarget) {
      const destMi = _touchTarget.dataset.dropMi !== '' && _touchTarget.dataset.dropMi != null
        ? parseInt(_touchTarget.dataset.dropMi) : mi;
      await applyEventSlot(evt,
        _touchTarget.dataset.dropWeek ? parseInt(_touchTarget.dataset.dropWeek) : null,
        _touchTarget.dataset.dropDay ? parseInt(_touchTarget.dataset.dropDay) : null,
        destMi);
      cleanup();
      saveToFirestore();
      refreshMonthContent(mi);
      if (destMi !== mi) refreshMonthContent(destMi);
      return;
    }
    cleanup();
  });

  pill.addEventListener('touchcancel', cleanup);
}

function weekBandEndsBeforeToday(mi, band, now) {
  const y = monthYear(mi), m = monthIndex(mi);
  const end = new Date(y, m, band.to);
  end.setHours(23, 59, 59, 999);
  return end.getTime() < now.getTime();
}

function renderWeekDayGrid(parent, mi, band, collapsed) {
  const daysGrid = document.createElement('div');
  daysGrid.className = 'week-days-grid';
  if (collapsed) daysGrid.style.display = 'none';
  daysGrid.style.gridTemplateColumns = 'repeat(7, minmax(88px, 1fr))';

  const cols = dayColumnsForBand(mi, band);
  cols.forEach(({ date, label: dayLabel, weekend, outside, bleed, inert, cellMi }) => {
    const col = document.createElement('div');
    col.className = 'week-day-col'
      + (weekend ? ' week-day-col--weekend' : '')
      + (outside ? ' week-day-col--na' : '')
      + (bleed ? ' week-day-col--bleed' : '');

    const header = document.createElement('div');
    header.className = 'week-day-header';
    if (inert) {
      header.innerHTML = '<span class="week-day-na">·</span>';
    } else {
      const today = new Date();
      const isToday = cellMi != null
        && monthYear(cellMi) === today.getFullYear()
        && monthIndex(cellMi) === today.getMonth()
        && date === today.getDate();
      header.innerHTML = '<span class="week-day-num' + (isToday ? ' week-day-num--today' : '') + '">' + date + '</span>';
    }
    col.appendChild(header);

    const body = document.createElement('div');
    body.className = 'week-day-body';

    if (inert || cellMi == null) {
      col.appendChild(body);
      daysGrid.appendChild(col);
      return;
    }

    body.dataset.dropMi = cellMi;
    body.dataset.dropWeek = String(band.key);
    body.dataset.dropDay = String(date);

    body.addEventListener('dragover', (e) => {
      if (_dragEvt) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; body.classList.add('drop-target'); }
    });
    body.addEventListener('dragleave', (e) => {
      if (!body.contains(e.relatedTarget)) body.classList.remove('drop-target');
    });
    body.addEventListener('drop', async (e) => {
      e.preventDefault(); body.classList.remove('drop-target');
      if (!_dragEvt) return;
      const destMi = cellMi;
      await applyEventSlot(_dragEvt, band.key, date, destMi);
      const srcMi = _dragMi;
      _dragEvt = null; _dragMi = null;
      saveToFirestore();
      if (srcMi != null) refreshMonthContent(srcMi);
      refreshMonthContent(destMi);
      if (destMi > 0) refreshMonthContent(destMi - 1);
      if (destMi < 11) refreshMonthContent(destMi + 1);
    });

    EVENTS.filter(e => {
      const cat = CATS.find(c => c.id === e.cat);
      return cat && e.m === cellMi && e.day === date;
    }).forEach(evt => body.appendChild(makePill(evt, cellMi)));

    const addBtn = document.createElement('button');
    addBtn.className = 'week-add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Add to ' + dayLabel + ' ' + ordinal(date);
    addBtn.onclick = (e) => {
      e.stopPropagation();
      const _band = bandForDate(cellMi, date);
      showCatPicker(addBtn, cellMi, _band ? _band.key : null, date);
    };
    body.appendChild(addBtn);

    col.appendChild(body);
    daysGrid.appendChild(col);
  });

  parent.appendChild(daysGrid);
  return daysGrid;
}

function renderMonthWeeks(container, mi) {
  // Month grid: Sun–Sat week rows (calendar layout). Past weeks collapse.
  const calYear = monthYear(mi);
  const calMonth = monthIndex(mi);
  const monShort = new Date(calYear, calMonth, 1).toLocaleDateString('en-AU', { month: 'short' });
  const BANDS = monthWeekBands(mi);
  const now = new Date();
  const isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth();

  // Shared day-of-week header (calendar chrome)
  const dowHead = document.createElement('div');
  dowHead.className = 'cal-dow-header';
  for (let d = 0; d < 7; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-dow-cell' + (d === 0 || d === 6 ? ' cal-dow-cell--weekend' : '');
    cell.textContent = DOW_LABELS[d];
    dowHead.appendChild(cell);
  }
  container.appendChild(dowHead);

  const pastBands = [];
  const liveBands = [];
  BANDS.forEach(b => {
    if (isCurrentMonth && weekBandEndsBeforeToday(mi, b, now)) pastBands.push(b);
    else liveBands.push(b);
  });

  if (pastBands.length) {
    const eKey = 'earlier_weeks_' + mi;
    const expanded = !!earlierExpanded[eKey];
    const weekSec = document.createElement('div');
    weekSec.className = 'week-section week-section--earlier';

    const wLabel = document.createElement('div');
    wLabel.className = 'week-label week-earlier';
    const colIcon = document.createElement('span');
    colIcon.className = 'week-collapse-icon';
    colIcon.textContent = expanded ? '▼' : '▶';
    wLabel.appendChild(colIcon);
    const labelText = document.createElement('span');
    labelText.className = 'week-label-text';
    labelText.textContent = 'Earlier weeks · ' + pastBands.length;
    wLabel.appendChild(labelText);
    weekSec.appendChild(wLabel);

    const body = document.createElement('div');
    body.className = 'week-earlier-body';
    if (!expanded) body.style.display = 'none';

    pastBands.forEach(band => {
      const wrap = document.createElement('div');
      wrap.className = 'week-section week-section--nested';
      renderWeekDayGrid(wrap, mi, band, false);
      body.appendChild(wrap);
    });
    weekSec.appendChild(body);

    wLabel.onclick = () => {
      earlierExpanded[eKey] = !earlierExpanded[eKey];
      try { localStorage.setItem('ppc-earlier-expanded', JSON.stringify(earlierExpanded)); } catch (_) {}
      colIcon.textContent = earlierExpanded[eKey] ? '▼' : '▶';
      body.style.display = earlierExpanded[eKey] ? '' : 'none';
    };

    container.appendChild(weekSec);
  }

  liveBands.forEach(band => {
    const weekSec = document.createElement('div');
    weekSec.className = 'week-section';
    renderWeekDayGrid(weekSec, mi, band, false);
    container.appendChild(weekSec);
  });

  // Unassigned / Any
  {
    const wKey = mi + '_null';
    const collapsed = !!weekCollapsed[wKey];
    const weekSec = document.createElement('div');
    weekSec.className = 'week-section';

    const wLabel = document.createElement('div');
    wLabel.className = 'week-label week-unassigned';
    const colIcon = document.createElement('span');
    colIcon.className = 'week-collapse-icon';
    colIcon.textContent = collapsed ? '▶' : '▼';
    wLabel.appendChild(colIcon);
    const labelText = document.createElement('span');
    labelText.className = 'week-label-text';
    labelText.textContent = 'Unassigned / Any';
    wLabel.appendChild(labelText);
    weekSec.appendChild(wLabel);

    const addArea = document.createElement('div');
    addArea.className = 'week-add-area';
    addArea.dataset.dropMi = mi; addArea.dataset.dropWeek = ''; addArea.dataset.dropDay = '';
    if (collapsed) addArea.style.display = 'none';

    wLabel.onclick = () => {
      weekCollapsed[wKey] = !weekCollapsed[wKey];
      colIcon.textContent = weekCollapsed[wKey] ? '▶' : '▼';
      addArea.style.display = weekCollapsed[wKey] ? 'none' : '';
    };

    addArea.addEventListener('dragover', (e) => {
      if (_dragEvt) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; addArea.classList.add('drop-target'); }
    });
    addArea.addEventListener('dragleave', (e) => {
      if (!addArea.contains(e.relatedTarget)) addArea.classList.remove('drop-target');
    });
    addArea.addEventListener('drop', async (e) => {
      e.preventDefault(); addArea.classList.remove('drop-target');
      if (!_dragEvt) return;
      const srcMi = _dragMi;
      await applyEventSlot(_dragEvt, null, null, mi);
      _dragEvt = null; _dragMi = null;
      saveToFirestore();
      if (srcMi != null && srcMi !== mi) refreshMonthContent(srcMi);
      refreshMonthContent(mi);
    });

    EVENTS.filter(e => {
      const cat = CATS.find(c => c.id === e.cat);
      return cat && e.m === mi && e.week == null && e.day == null;
    }).forEach(evt => addArea.appendChild(makePill(evt, mi)));

    const addBtn = document.createElement('button');
    addBtn.className = 'week-add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Add to Unassigned / Any';
    addBtn.onclick = (e) => { e.stopPropagation(); showCatPicker(addBtn, mi, null, null); };
    addArea.appendChild(addBtn);
    weekSec.appendChild(addArea);
    container.appendChild(weekSec);
  }
}

let activePicker = null;
