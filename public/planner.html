function _positionPicker(picker, anchor) {
  document.body.appendChild(picker);
  activePicker = picker;
  const rect = anchor.getBoundingClientRect();
  const below = window.innerHeight - rect.bottom;
  const top = below > 270 ? rect.bottom + 4 : rect.top - 300 - 4;
  picker.style.top = Math.max(8, top) + 'px';
  picker.style.left = Math.min(rect.left, window.innerWidth - 290) + 'px';
  setTimeout(() => document.addEventListener('click', closeCatPickerOutside), 0);
}

function getFgForBg(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#2C2C2C' : '#fff';
}

function buildColorGrid(selectedColor, onSelect) {
  const COLOR_LIB = [
    // Teals
    '#b2d8db','#89c0c4','#60a8ad','#478589','#3a6e72','#2d5658','#1f3e3f','#122526',
    // Sky blues
    '#c8e6f4','#9dcce9','#73b2de','#4898d3','#2f7fc9','#2365ae','#1a4c93','#103478',
    // Navys
    '#c2cde6','#94a6cf','#667fb8','#4965a1','#344364','#263252','#182141','#0c1030',
    // Purples
    '#d4cde8','#b5a9d5','#9585c2','#7a62af','#6B5A9C','#574888','#433674','#302460',
    // Reds/corals
    '#f5c2b8','#ec9889','#e36e5a','#da442b','#c94a4a','#b03030','#921818','#740000',
    // Oranges
    '#f8dbb0','#f4c078','#f0a540','#ec8a08','#d4763b','#b85c20','#9c4208','#802800',
    // Yellows
    '#fdf2a8','#fae97a','#f7e04c','#f4d71e','#EDD960','#d4c140','#baa920','#a09100',
    // Greens
    '#b8e6c8','#88d4a4','#58c280','#28b05c','#4a8a5c','#3a7048','#2a5634','#1a3c20',
    // Warm neutrals
    '#f4f0eb','#e8e0d6','#d4c8b8','#c0b0a0','#a89688','#8e7c6c','#746250','#5a4834',
    // Cool grays
    '#e4e8ed','#c8d0d9','#acb8c5','#90a0b1','#6B7A8D','#556070','#3f4853','#2a3036',
    // Darks
    '#8c8c8c','#6e6e6e','#505050','#404040','#2C2C2C','#1e1e1e','#101010','#000000',
  ];
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:10px;';
  COLOR_LIB.forEach(color => {
    const sw = document.createElement('button');
    const isSel = color.toLowerCase() === (selectedColor||'').toLowerCase();
    sw.style.cssText = `width:100%;aspect-ratio:1;border-radius:4px;background:${color};border:2.5px solid ${isSel ? '#fff' : 'transparent'};outline:${isSel ? '2px solid #344364' : 'none'};outline-offset:-1px;cursor:pointer;padding:0;transition:transform 0.1s;`;
    sw.title = color;
    sw.onmouseenter = () => { sw.style.transform = 'scale(1.18)'; };
    sw.onmouseleave = () => { sw.style.transform = ''; };
    sw.onclick = (e) => {
      e.stopPropagation();
      grid.querySelectorAll('button').forEach(b => { b.style.borderColor = 'transparent'; b.style.outline = 'none'; });
      sw.style.borderColor = '#fff';
      sw.style.outline = '2px solid #344364';
      sw.style.outlineOffset = '-1px';
      selectedColor = color;
      onSelect(color);
    };
    grid.appendChild(sw);
  });
  return grid;
}

// ─── SUBTASKS ────────────────────────────────────────────────────────────────

function createSubtaskItem(text, checked) {
  const li = document.createElement('li');
  li.className = 'subtask-item';

  const check = document.createElement('input');
  check.type = 'checkbox';
  check.className = 'subtask-check';
  check.checked = !!checked;

  const textSpan = document.createElement('span');
  textSpan.className = 'subtask-text';
  textSpan.contentEditable = 'true';
  textSpan.textContent = text || '';

  // Enter → new checkbox below; Shift+Enter → newline in this item
  textSpan.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const newLi = createSubtaskItem('', false);
      li.after(newLi);
      newLi.querySelector('.subtask-text').focus();
    }
    // Shift+Enter falls through to default (inserts newline)
  });

  const del = document.createElement('button');
  del.className = 'subtask-del';
  del.textContent = '×';
  del.onclick = () => li.remove();

  li.appendChild(check);
  li.appendChild(textSpan);
  li.appendChild(del);
  return li;
}

function renderSubtasks(tasks) {
  const list = document.getElementById('subtaskList');
  list.innerHTML = '';
  (tasks || []).forEach(t => {
    const checked = t.startsWith('[x] ');
    list.appendChild(createSubtaskItem(t.replace(/^\[x\] /, ''), checked));
  });
}

function addSubtask(text) {
  const list = document.getElementById('subtaskList');
  const li = createSubtaskItem(text || '', false);
  list.appendChild(li);
  if (!text) setTimeout(() => li.querySelector('.subtask-text').focus(), 10);
}

function readSubtasks() {
  const result = [];
  document.querySelectorAll('#subtaskList .subtask-item').forEach(li => {
    const check = li.querySelector('.subtask-check');
    const textEl = li.querySelector('.subtask-text');
    if (!textEl) return;
    const text = (textEl.textContent || '').trim();
    if (text) result.push(((check && check.checked) ? '[x] ' : '') + text);
  });
  return result;
}

// ─── PANEL ───────────────────────────────────────────────────────────────────

function openNewEventPanel(cat, monthIdx, weekNum, dayKey = null) {
  activeEvt = null;
  activeCat = cat;
  activeNewMonth = monthIdx;
  activeNewWeek = weekNum !== undefined ? weekNum : null;
  activeNewDay = dayKey;

  document.getElementById('panelStrip').style.background = cat.bg;
  document.getElementById('pTitle').textContent = '';
  document.getElementById('pCatBadge').textContent = cat.label;
  document.getElementById('pCatBadge').style.background = cat.bg + '22';
  document.getElementById('pCatBadge').style.color = accentTextColor(cat.bg);
  setPpcSelectValue('pStatus', 'planned');
  document.getElementById('pDate').value = MONTHS[monthIdx];
  fillWeekSelect(monthIdx, activeNewWeek);
  document.getElementById('pDay').value = dayKey || '';
  document.getElementById('pExactDate').value = '';
  fillProjectSelect('');
  document.getElementById('pDesc').textContent = '';
  renderSubtasks([]);
  updateStatusColor();

  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('pTitle').focus(), 50);
}

// Project list mirrors the Task Board's, so an item is filed the same on both.
function fillProjectSelect(selected) {
  updatePpcSelect('pProject', {
    options: [{ id: '', label: 'Misc — no project' }].concat(
      BOARD_PROJECTS.map(p => ({ id: p.id, label: p.name }))
    ),
    value: selected || ''
  });
}

// Week options depend on the month — a month can span 4, 5 or 6 calendar weeks.
function fillWeekSelect(mi, selected) {
  const monShort = (mi == null) ? '' : new Date(monthYear(mi), monthIndex(mi), 1).toLocaleDateString('en-AU', { month: 'short' });
  const bands = (mi == null) ? [] : monthWeekBands(mi);
  const options = [{ id: '', label: 'Unassigned / Any' }].concat(
    bands.map(b => {
      const r = bandLabelRange(mi, b);
      return { id: String(b.key), label: 'Week ' + b.key + ' — ' + r.from + '–' + r.to + ' ' + monShort };
    })
  );
  updatePpcSelect('pWeek', { options, value: selected != null && selected !== '' ? String(selected) : '' });
}

// Picking an exact date drives placement — keep Month/Week/Day in step with it.
function onExactDateChange() {
  const iso = document.getElementById('pExactDate').value;
  if (!iso) return;
  const slot = dateToPlannerSlot(iso);
  if (!slot) {
    alert('That date sits outside the planner year (Jul 2026 – Jun 2027).');
    document.getElementById('pExactDate').value = activeEvt && activeEvt.dueDate ? activeEvt.dueDate : '';
    return;
  }
  document.getElementById('pDate').value = MONTHS[slot.m];
  fillWeekSelect(slot.m, slot.week);
  document.getElementById('pDay').value = slot.day || '';
}
function clearExactDate() {
  document.getElementById('pExactDate').value = '';
}

function openPanel(evt, cat) {
  activeEvt = evt;
  activeCat = cat;
  activeNewMonth = null;
  activeNewWeek = null;

  document.getElementById('panelStrip').style.background = cat.bg;
  document.getElementById('pTitle').textContent = evt.title;
  document.getElementById('pCatBadge').textContent = cat.label;
  document.getElementById('pCatBadge').style.background = cat.bg + '22';
  document.getElementById('pCatBadge').style.color = accentTextColor(cat.bg);
  setPpcSelectValue('pStatus', evt.status || 'planned');
  document.getElementById('pDate').value = evt.date || '';
  fillWeekSelect(evt.m, evt.week);
  document.getElementById('pDay').value = evt.day || '';
  document.getElementById('pExactDate').value = evt.dueDate || '';
  fillProjectSelect(evt.project || '');
  document.getElementById('pDesc').textContent = evt.body || '';
  renderSubtasks(evt.tasks || []);
  updateStatusColor();

  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

async function savePanel() {
  try {
    const titleEl = document.getElementById('pTitle');
    const title = (titleEl && titleEl.textContent || '').replace(/\u00a0/g, ' ').trim();
    if (!title) {
      showToast('Add a title before saving');
      if (titleEl) titleEl.focus();
      return;
    }

    const weekEl = document.getElementById('pWeek');
    const dayEl = document.getElementById('pDay');
    const statusEl = document.getElementById('pStatus');
    const projectEl = document.getElementById('pProject');
    const dateEl = document.getElementById('pExactDate');
    const descEl = document.getElementById('pDesc');

    let weekVal = weekEl ? weekEl.value : '';
    let week = weekVal ? parseInt(weekVal, 10) : null;
    if (isNaN(week)) week = null;
    const rawDay = dayEl ? dayEl.value : '';
    let dayVal = rawDay === '' || rawDay == null ? null : parseInt(rawDay, 10);
    if (isNaN(dayVal)) dayVal = null;
    const exactDate = (dateEl && dateEl.value) || null;
    const projectId = (projectEl && projectEl.value) || null;
    const status = (statusEl && statusEl.value) || 'planned';
    const body = (descEl && descEl.textContent || '').trim();
    const tasks = readSubtasks();

    // An exact date wins: it pins the pill to that day on the timeline.
    let monthIdx = activeEvt ? activeEvt.m : activeNewMonth;
    if (exactDate) {
      const slot = dateToPlannerSlot(exactDate);
      if (slot) { monthIdx = slot.m; week = slot.week; dayVal = slot.day; }
    } else if (activeEvt && activeEvt.srcCardId) {
      // Linked Task Board card with date cleared → Unassigned / Any.
      week = null;
      dayVal = null;
    }

    let savedEvt = null;
    if (!activeEvt) {
      const created = {
        id:     'e' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4),
        cat:    activeCat.id,
        m:      monthIdx,
        week:   week,
        day:    dayVal,
        title:  title,
        date:   MONTHS[monthIdx] || (document.getElementById('pDate') || {}).value || '',
        body:   body,
        status: status,
        tasks:  tasks
      };
      if (exactDate) created.dueDate = exactDate;
      if (projectId) created.project = projectId;
      EVENTS.push(created);
      savedEvt = created;
    } else {
      activeEvt.title  = title;
      activeEvt.m      = monthIdx;
      activeEvt.week   = week;
      activeEvt.day    = dayVal;
      activeEvt.status = status;
      activeEvt.date   = MONTHS[monthIdx] || (document.getElementById('pDate') || {}).value || activeEvt.date;
      activeEvt.body   = body;
      activeEvt.tasks  = tasks;
      if (exactDate) activeEvt.dueDate = exactDate; else delete activeEvt.dueDate;
      if (projectId) activeEvt.project = projectId; else delete activeEvt.project;
      if (activeEvt.srcCardId) {
        const ok = await pushEventToCard(activeEvt);
        if (!ok) showToast('Saved on planner — Task Board sync failed, will retry on refresh');
      }
      savedEvt = activeEvt;
    }

    saveToFirestore();
    renderVertical();
    closePanel();
    const changed = await syncDateMirrors({ preferLocalId: savedEvt && savedEvt.id });
    if (changed) { saveToFirestore(); renderVertical(); }
  } catch (err) {
    console.error('savePanel failed:', err);
    showToast('Could not save — try again');
  }
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  activeEvt = null;
  activeCat = null;
  activeNewMonth = null;
  activeNewWeek = null;
  activeNewDay = null;
}

// ─── REVENUE CHART ───────────────────────────────────────────────────────────

function drawChart() {
  const svg = document.getElementById('revChart');
  svg.innerHTML = '';
  const W = svg.parentElement.offsetWidth;
  const H = 110;
  const padB = 22;
  const chartH = H - padB;
  const colW = W / 12;
  const barW = colW * 0.55;
  const max = 8000;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  REVENUE.forEach((rev, i) => {
    const barH = Math.round((rev / max) * (chartH - 10));
    const x = i * colW + (colW - barW) / 2;
    const y = chartH - barH;
    const fill = rev >= 8000 ? '#4E6E6C' : rev >= 4000 ? '#344364' : '#6B7A8D';

    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', barW);
    rect.setAttribute('height', barH);
    rect.setAttribute('fill', fill);
    rect.setAttribute('rx', '2');
    svg.appendChild(rect);

    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x', i * colW + colW / 2);
    lbl.setAttribute('y', H - 5);
    lbl.setAttribute('text-anchor','middle');
    lbl.setAttribute('font-size','10');
    lbl.setAttribute('fill','#6B7A8D');
    lbl.setAttribute('font-family','DM Sans, sans-serif');
    lbl.textContent = rev >= 1000 ? `$${(rev/1000).toFixed(1)}k` : `$${rev}`;
    svg.appendChild(lbl);
  });

  const targetY = chartH - Math.round((8000/max)*(chartH-10));
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',0); line.setAttribute('x2',W);
  line.setAttribute('y1',targetY); line.setAttribute('y2',targetY);
  line.setAttribute('stroke','#EDD960'); line.setAttribute('stroke-width','1');
  line.setAttribute('stroke-dasharray','4 4');
  svg.appendChild(line);

  const lineLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  lineLabel.setAttribute('x', W - 4);
  lineLabel.setAttribute('y', targetY - 4);
  lineLabel.setAttribute('text-anchor','end');
  lineLabel.setAttribute('font-size','9');
  lineLabel.setAttribute('fill','#EDD960');
  lineLabel.setAttribute('font-family','DM Sans, sans-serif');
  lineLabel.textContent = '$8k target';
  svg.appendChild(lineLabel);
}

// ─── SETTINGS SIDEBAR ────────────────────────────────────────────────────────

let settingsTab = 'projects';

function openSettings() {
  document.getElementById('autoAssignToggle').checked = SETTINGS.kanbanAutoAssign !== false;
  renderSettingsList();
  document.getElementById('settingsPanel').classList.add('open');
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('settingsOverlay').classList.remove('open');
}

function setSettingsTab(tab) {
  settingsTab = tab;
  document.getElementById('settingsTabProjects').classList.toggle('active', tab === 'projects');
  document.getElementById('settingsTabReleases').classList.toggle('active', tab === 'releases');
  renderSettingsList();
}

function renderSettingsList() {
  const list = document.getElementById('settingsList');
  list.innerHTML = '';

  let items, emptyMsg;
  if (settingsTab === 'projects') {
    // Active projects = events currently in progress
    items = EVENTS.filter(e => e.status === 'in-progress');
    emptyMsg = 'No active projects right now.';
  } else {
    // Product releases = Collections & Launches events
    items = EVENTS.filter(e => e.cat === 'col');
    emptyMsg = 'No release events yet.';
  }
  items = items.slice().sort((a, b) => (a.m ?? 0) - (b.m ?? 0));

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'settings-empty';
    empty.textContent = emptyMsg;
    list.appendChild(empty);
    return;
  }

  items.forEach(evt => {
    const cat = CATS.find(c => c.id === evt.cat);
    const item = document.createElement('div');
    item.className = 'settings-item';
    if (cat) item.style.borderLeftColor = cat.bg;

    const title = document.createElement('div');
    title.className = 'settings-item-title';
    title.textContent = evt.title;
    item.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'settings-item-meta';
    const bits = [evt.date || MONTHS[evt.m] || ''];
    if (settingsTab === 'projects' && cat) bits.push(cat.label);
    if (settingsTab === 'releases') bits.push(evt.status === 'in-progress' ? 'In progress' : (evt.status === 'complete' ? 'Complete' : 'Planned'));
    meta.textContent = bits.filter(Boolean).join(' · ');
    item.appendChild(meta);

    item.style.cursor = 'pointer';
    item.onclick = () => { closeSettings(); if (cat) openPanel(evt, cat); };
    list.appendChild(item);
  });
}

function toggleKanbanAutoAssign(cb) {
  SETTINGS.kanbanAutoAssign = cb.checked;
  saveToFirestore();
}

PPC.mountSettings({
  onRefresh: async () => { await refreshPlanner(); },
  onAfterRecover: async (entry) => {
    if (entry && entry.source === 'planner') await refreshPlanner();
  }
});
darkMode = PPC.applyStoredDark();
initApp();
drawChart();
window.addEventListener('resize', drawChart);
</script>
